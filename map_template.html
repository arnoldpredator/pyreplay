  // #129: graph theory beside the degree counts — every number NAMES
  // its graph, and betweenness routinely crowns a different (truer)
  // load-bearing wall than fan-in does
  const G = DATA.graphlens;
  if (G && G.between && Object.keys(G.between).length) {
    const top = o => Object.entries(o)
      .sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1))
      .slice(0, 8);
    html += '<div class="wallhead">⛓ betweenness — what everything ' +
      "routes THROUGH (static import graph, Brandes; fan-in above " +
      "counts doors, this counts corridors)</div>" +
      top(G.between).map(([id, b]) =>
        '<div class="wallrow" data-id="' + esc(id) +
        '"><span class="win">' + b + "</span>" + esc(id) +
        "</div>").join("");
    if (G.betweenObs) {
      html += '<div class="wallhead">⛓ betweenness — observed call ' +
        "pairs (adopted runs; a different graph, and it may crown a " +
        "different wall)</div>" +
        top(G.betweenObs).map(([id, b]) =>
          '<div class="wallrow" data-id="' + esc(id) +
          '"><span class="win">' + b + "</span>" + esc(id) +
          "</div>").join("");
    }
    if (G.percolation && G.percolation.length > 1) {
      const P = G.percolation;
      const W = 250, Hh = 70, pad = 6;
      const sx = k => pad + k / (P.length - 1) * (W - 2 * pad);
      const sy = gfrac => Hh - pad - gfrac * (Hh - 2 * pad);
      let svg = '<svg width="' + W + '" height="' + Hh + '">';
      svg += '<polyline fill="none" stroke="#c678dd" stroke-width="1.6" points="' +
        P.map((p, i) => sx(i) + "," + sy(p.giant)).join(" ") + '"/>';
      P.forEach((p, i) => {
        svg += '<circle cx="' + sx(i) + '" cy="' + sy(p.giant) +
          '" r="2.6" fill="#c678dd"><title>' +
          (p.k === 0 ? "intact map" : "top " + p.k + " removed (last: " +
            esc(p.removed) + ")") + " → giant component " +
          Math.round(p.giant * 100) + "%</title></circle>";
      });
      svg += "</svg>";
      html += '<div class="wallhead">💥 dependency fragility — remove ' +
        "the top-k most-between modules (initial ranking), watch the " +
        "giant component collapse</div>" +
        '<div style="padding:2px 0">' + svg + '</div>' +
        '<div class="wallnote">left = intact (' +
        Math.round(G.percolation[0].giant * 100) + "% connected) · " +
        "right = top " + (G.percolation.length - 1) + " removed (" +
        Math.round(G.percolation[G.percolation.length - 1].giant * 100) +
        "%) — a cliff marks a wall the fan counts may have missed" +
        "</div>";
    }
    if (G.degrees) {
      const dd = Object.entries(G.degrees)
        .sort((a, b) => +a[0] - +b[0]);
      html += '<div class="wallnote" style="margin-top:6px">degree ' +
        "distribution (undirected imports): " +
        dd.map(([d, c]) => d + "°×" + c).join(" · ") +
        " — too few points for any power-law claim; a straight line " +
        "on log-log here proves nothing.</div>";
    }
  }
  // #94: the load-bearing FUNCTIONS — cross-module def→def fan-in
  const CGW = DATA.callgraph;
  if (CGW && CGW.fanin && CGW.fanin.length) {
    html += '<div class="wallhead">☎ load-bearing functions — ' +
      "cross-module callers, def→def (static, resolved only)</div>" +
      CGW.fanin.map(([d, n, m]) => {
        const mod = d.split(":", 1)[0];
        return '<div class="wallrow" data-id="' + esc(mod) +
          '" title="' + esc(d) + " ← " + n + " call site(s) in " + m +
          ' module(s) — click to spotlight its module">' +
          '<span class="win">←' + n + "</span>" + esc(d) + "</div>";
      }).join("") +
      '<div class="wallnote">' + CGW.resolved + " def→def call " +
      "sites resolved · " + CGW.guessed + " guessed (name not " +
      "found in the target module) · " + CGW.modOnly + " module-" +
      "level only · plus " + (DATA.unresolvedCalls || 0) +
      " sites static analysis cannot attribute (obj.method(), " +
      "dynamic dispatch — the trace's job, #119)." +
      (CGW.total > CGW.edges.length
        ? " Edge list capped at " + CGW.edges.length + " of " +
          CGW.total + "."
        : "") + "</div>";
  }
  $("wallsbody").innerHTML = html;
  box.style.display = "block";
};
function fmtCost(us) {
  if (us < 1000) return Math.round(us) + " µs";
  if (us < 1e6) return (us / 1000).toFixed(1) + " ms";
  return (us / 1e6).toFixed(2) + " s";
}
$("wallsbody").onclick = e => {
  const r = e.target.closest(".wallrow");
  if (!r || !r.dataset.id) return;
  // exact-id spotlight: a substring query for a package name would
  // light every sub-module box and the clicked wall would drown
  exactSel = exactSel === r.dataset.id ? null : r.dataset.id;
  query = "";
  $("search").value = "";
  setCycleSel(null);
  render();
};

/* pan + zoom */
let scale = 1, tx = 0, ty = 0, panning = false, px = 0, py = 0,
    dragMoved = false;
function apply() {
  world.setAttribute("transform",
    "translate(" + tx + " " + ty + ") scale(" + scale + ")");
}
const canvas = $("canvas");
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const ns = Math.min(4, Math.max(0.05, scale * f));
  const r = ns / scale;
  tx = e.clientX - r * (e.clientX - tx);
  ty = e.clientY - r * (e.clientY - ty);
  scale = ns;
  apply();
}, { passive: false });
canvas.addEventListener("mousedown", e => {
  panning = true; dragMoved = false; px = e.clientX; py = e.clientY;
  canvas.classList.add("panning");
});
window.addEventListener("mousemove", e => {
  if (!panning) return;
  if (Math.abs(e.clientX - px) + Math.abs(e.clientY - py) > 3)
    dragMoved = true;
  tx += e.clientX - px; ty += e.clientY - py;
  px = e.clientX; py = e.clientY;
  apply();
});
window.addEventListener("mouseup", () => {
  panning = false;
  canvas.classList.remove("panning");
});
function fit() {
  const bb = world.getBBox();
  if (!bb.width) return;
  const cw = canvas.clientWidth, chh = canvas.clientHeight;
  scale = Math.min(4, Math.min(cw / (bb.width + 80),
                               chh / (bb.height + 80)));
  tx = (cw - bb.width * scale) / 2 - bb.x * scale;
  ty = (chh - bb.height * scale) / 2 - bb.y * scale;
  apply();
}
$("fit").onclick = fit;

render();
fit();
</script>
</body>
</html>
