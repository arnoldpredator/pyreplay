<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pyreplay — trace replayer</title>
<style>
  :root {
    --bg: #14161c; --panel: #1c1f28; --border: #2a2e3b;
    --text: #d6d9e0; --dim: #7d8493; --accent: #5eb1ff;
    --hl: #2c3d5c; --changed-bg: #3d3320; --changed-text: #ffd479;
    --call: #7ee08a; --line: #5eb1ff; --ret: #ff9d76; --err: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.5 "SF Mono", "Fira Code", Consolas, Menlo, monospace;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 14px; font-weight: 600; color: var(--accent); }
  header h1 span { color: var(--dim); font-weight: 400; }
  .controls { display: flex; gap: 6px; align-items: center; }
  button {
    background: #262b38; color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 10px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    border-color: var(--accent); color: var(--accent); font-weight: 700;
  }
  #banner.info { background: #1d2a3a; color: var(--accent); }
  select {
    background: #262b38; color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 6px; font: inherit;
  }
  #counter { color: var(--dim); margin-left: auto; }
  #banner {
    display: none; padding: 8px 14px; background: #3a1d1d;
    color: var(--err); border-bottom: 1px solid var(--border);
    white-space: pre-wrap;
  }
  #tabs {
    display: flex; gap: 2px; background: var(--panel);
    border-bottom: 1px solid var(--border); padding: 0 8px; overflow-x: auto;
  }
  .tab {
    padding: 5px 12px; color: var(--dim); cursor: pointer;
    border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }
  #code { flex: 1; overflow: auto; padding: 8px 0; }
  .ln { display: flex; white-space: pre; }
  .ln .no {
    width: 52px; text-align: right; padding-right: 14px; flex-shrink: 0;
    color: #4a5060; user-select: none;
  }
  .ln.current { background: var(--hl); }
  .ln.current .no { color: var(--accent); font-weight: 700; }
  #divider {
    width: 5px; flex-shrink: 0; cursor: col-resize;
    background: var(--border);
  }
  #divider:hover, #divider.dragging { background: var(--accent); }
  #side {
    width: 340px; flex-shrink: 0; border-left: 1px solid var(--border);
    background: var(--panel); overflow: auto; display: flex;
    flex-direction: column;
  }
  #side section { border-bottom: 1px solid var(--border); padding: 10px 12px; }
  #side h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin-bottom: 8px;
  }
  #btn-collapse, #btn-stack {
    float: right; padding: 0 8px; font-size: 11px; text-transform: none;
    letter-spacing: normal;
  }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 4px;
    font-weight: 700; font-size: 12px; color: #14161c;
  }
  .badge.call   { background: var(--call); }
  .badge.line   { background: var(--line); }
  .badge.return { background: var(--ret); }
  .badge.exc    { background: var(--err); color: #fff; }
  .badge.excsoft { background: #8a6d3b; color: #fff; }
  .badge.yield  { background: #b48ead; }
  .badge.resume { background: #b48ead; }
  .badge.hb     { background: #56b6c2; }
  #wake { display: none; font-size: 12px; color: #56b6c2; }
  #wake .wkj { cursor: pointer; text-decoration: underline;
    color: var(--accent); }
  #ctx { color: var(--warn); font-size: 11px; margin-left: 10px; }
  /* machinery-badges menu: display toggles only — data is always recorded */
  #machmenu { position: relative; }
  #machmenu summary {
    list-style: none; cursor: pointer; padding: 5px 10px;
    border: 1px solid var(--border); border-radius: 4px;
    background: #262b38; font-size: 12px; user-select: none; }
  #machmenu summary::-webkit-details-marker { display: none; }
  #machmenu[open] summary { border-color: var(--accent); }
  #machmenu .machbox {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 60;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; display: flex;
    flex-direction: column; gap: 7px; white-space: nowrap;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #machmenu label { font-size: 12px; display: flex; gap: 7px;
    align-items: center; cursor: pointer; }
  #hint { color: var(--dim); font-size: 11px; font-style: italic;
          margin-top: 3px; }
  .gly {
    font-size: 10px; margin-left: 5px; padding: 0 4px;
    border-radius: 3px; background: #262b38; user-select: none;
  }
  .gly.mut { color: var(--changed-text); }
  .gly.reb { color: var(--accent); }
  .gly.cell { color: #c792ea; }
  .gly.def { color: var(--err); }
  .exmsg { color: var(--err); font-weight: 600; word-break: break-all; }
  .exmsg.soft { color: #d8b46a; }
  .ln.current.excl { background: #4a2328; }
  .ln.current.excl .no { color: var(--err); }
  #excmarks { position: relative; height: 7px; margin: 0 7px 2px; }
  .xmark {
    position: absolute; top: 0; width: 4px; height: 7px;
    background: var(--err); border-radius: 2px; cursor: pointer;
    transform: translateX(-2px);
  }
  .xmark:hover { background: #ff9d9d; }
  #bmarks { position: relative; height: 7px; margin: 0 7px 2px; }
  .bmark {
    position: absolute; top: 0; width: 4px; height: 7px;
    background: #5ec8ff; border-radius: 2px; cursor: pointer;
    transform: translateX(-2px);
  }
  .bmark:hover { background: #aee4ff; }
  #tripmarks { position: relative; height: 7px; margin: 0 7px 2px; }
  .tmark {
    position: absolute; top: 0; width: 4px; height: 7px;
    background: #e5c07b; border-radius: 2px; cursor: pointer;
    transform: translateX(-2px);
  }
  .tmark.tfirst { width: 6px; transform: translateX(-3px);
    box-shadow: 0 0 4px #e5c07b; }
  .tmark:hover { background: #ffe0a3; }
  .gly.trip { color: #e5c07b; }
  .tripnote { cursor: pointer; text-decoration: underline;
    text-underline-offset: 2px; }
  #chaplabel { margin-left: 8px; color: var(--dim); }
  #chaplabel.tok { color: #7fd1a8; }
  #chaplabel.tfail { color: var(--err); }
  #chapmarks { position: relative; height: 6px; margin: 0 7px 2px; }
  .chapspan {
    position: absolute; top: 0; height: 6px; border-radius: 2px;
    cursor: pointer; min-width: 3px; opacity: 0.85;
  }
  .chapspan.tok { background: #2f5d47; }
  .chapspan.tfail { background: var(--err); }
  .chapspan.tskip { background: #4a4f5c; }
  .chapspan:hover { opacity: 1; outline: 1px solid #fff5; }
  .suspectlink { cursor: pointer; text-decoration: underline;
    text-underline-offset: 2px; margin-left: 6px; }
  #qbar { display: flex; align-items: center; gap: 6px;
    margin: 0 7px 3px; }
  #query { flex: 1; background: #171a22; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 8px; font: inherit; font-size: 11px; }
  #query:focus { outline: 1px solid var(--accent); }
  #qcount { color: var(--dim); font-size: 11px; white-space: nowrap; }
  #qbar button { background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    cursor: pointer; padding: 1px 7px; }
  .ln .no { cursor: pointer; }
  .ln.dead .no { opacity: 0.35; text-decoration: line-through; }
  #whyline { font-size: 11px; }
  #whyline .wl { border-left: 2px solid var(--warn, #e5c07b);
    padding: 3px 8px; margin: 4px 0; background: #1d1f28; }
  #whyline .wl b { color: var(--warn, #e5c07b); }
  #whyline .wlj { cursor: pointer; text-decoration: underline;
    text-underline-offset: 2px; color: var(--accent); margin-left: 4px; }
  #iface { font-size: 11px; color: var(--dim); }
  #iface .sig { color: var(--text); }
  #iface .unst { color: var(--warn, #e5c07b); }
  #iface .wlj { cursor: pointer; text-decoration: underline;
    text-underline-offset: 2px; color: var(--accent); margin-left: 4px; }
  #console { max-height: 170px; overflow-y: auto; font-size: 11px; }
  #constat { color: var(--dim); font-weight: 400; font-size: 11px; }
  .clog { padding: 0 4px; cursor: pointer; white-space: pre-wrap;
    word-break: break-all; color: var(--dim); border-left: 2px solid
    transparent; }
  .clog.err { color: #c98a8a; }
  .clog.lvl-warn { color: var(--warn, #e5c07b); }
  .clog.lvl-error { color: var(--err); }
  .clog.past { color: var(--text); }
  .clog.past.err { color: #e09a9a; }
  .clog.cur { border-left-color: var(--accent); background: #1d2230; }
  .clog:hover { background: #232839; }
  .badge.log { background: #2a3040; color: #9fb4d8; }
  #repro { border-top: 1px solid var(--border); padding: 6px 10px;
    font-size: 11px; color: var(--dim); }
  #repro summary { cursor: pointer; color: var(--text); }
  #repro code { display: block; background: #171a22; border: 1px solid
    var(--border); border-radius: 4px; padding: 4px 8px; margin: 6px 0;
    word-break: break-all; user-select: all; }
  #repro button { background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    cursor: pointer; padding: 1px 7px; margin: 2px 6px 2px 0; }
  #anatbox { border-top: 1px solid var(--border); padding: 6px 10px;
    font-size: 11px; color: var(--dim); }
  #anatbox summary { cursor: pointer; color: var(--text); }
  #anatbox #anatname { color: var(--dim); font-weight: 400; }
  .ahead { margin: 8px 0 3px; color: var(--accent); font-size: 10px;
    text-transform: uppercase; letter-spacing: .5px; }
  .anote { color: var(--dim); font-style: italic; margin: 3px 0; }
  .astbox { max-height: 200px; overflow: auto; background: #171a22;
    border: 1px solid var(--border); border-radius: 4px;
    margin-top: 3px; padding: 3px 6px; }
  .astn { margin-left: 12px; }
  .astbox > .astn { margin-left: 0; }
  .astn.leaf { padding: 0 2px; }
  details.astn > summary { cursor: pointer; list-style: none; }
  details.astn > summary::before { content: "▸ "; color: var(--dim); }
  details.astn[open] > summary::before { content: "▾ "; }
  .astn.cur > summary, .astn.leaf.cur { background: var(--changed-bg);
    color: var(--changed-text); border-radius: 3px; }
  .astn .apos { color: var(--dim); font-size: 9px; }
  .disbox { position: relative; max-height: 220px; overflow: auto;
    background: #171a22; border: 1px solid var(--border);
    border-radius: 4px; margin-top: 3px; padding: 3px 0; }
  .disrow { display: flex; gap: 7px; padding: 0 8px; white-space: pre; }
  .disrow.cur { background: var(--changed-bg); }
  .disrow .disl { min-width: 24px; text-align: right; color: var(--call); }
  .disrow .dist { min-width: 8px; color: var(--accent); }
  .disrow .diso { min-width: 26px; text-align: right; color: var(--dim); }
  .disrow .disop { color: var(--text); font-weight: 600; }
  .disrow.cur .disop, .disrow.cur .disl { color: var(--changed-text); }
  #qmarks { position: relative; height: 7px; margin: 0 7px 2px; }
  .qmark {
    position: absolute; top: 0; width: 4px; height: 7px;
    background: #d38aea; border-radius: 2px; cursor: pointer;
    transform: translateX(-2px);
  }
  .qmark:hover { background: #eebcfa; }
  .chartbox { margin-top: 3px; }
  .chartsvg { display: block; background: #171a22;
    border: 1px solid var(--border); border-radius: 4px; }
  .chartsvg circle { fill: var(--accent); }
  .chartsvg circle.cpoint:hover { fill: #cfe2ff; }
  .chartsvg rect.cnan { fill: #e5c07b; }
  .chartsvg rect.cinf { fill: var(--err); }
  .chartsvg text.cgap { fill: var(--dim); font-size: 9px; }
  .cpoint { cursor: pointer; }
  .chartcap { color: var(--dim); font-size: 10px; margin-top: 2px; }
  #thread { color: var(--changed-text); margin-left: 8px; }
  #where { color: var(--dim); margin-top: 6px; word-break: break-all; }
  #retval { margin-top: 6px; color: var(--ret); word-break: break-all; }
  #retval .dur { color: var(--dim); }
  #mro { margin-top: 8px; line-height: 2; }
  #mro .mrolabel { color: var(--dim); font-size: 11px; }
  .mroc {
    background: #262b38; border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 7px; font-size: 11px;
  }
  .mroc.passed { opacity: .45; text-decoration: line-through; }
  .mroc.sup { border-color: var(--call); color: var(--call);
              font-weight: 700; }
  .mroarrow { color: var(--dim); margin: 0 3px; }
  #density {
    display: flex; height: 8px; margin: 0 7px 3px;
    border-radius: 3px; overflow: hidden;
  }
  .dbucket { flex: 1; cursor: pointer; background: #20242f; }
  .dbucket:hover { filter: brightness(1.6); }
  #cond { margin-top: 8px; }
  #cond .cexpr { color: var(--dim); font-style: italic; }
  #cond .cvars { display: flex; flex-direction: column; gap: 3px;
                 padding: 4px 0; }
  #cond .cvar .vn { color: var(--accent); }
  #cond .cres { font-weight: 700; }
  #cond .cres.true { color: var(--call); }
  #cond .cres.false { color: var(--err); }
  #cond .cres.done { color: var(--dim); }
  #stack div { padding: 2px 0; color: var(--dim); }
  #stack div.top { color: var(--text); }
  #stack .fn { color: var(--call); }
  .vrow { padding: 5px 0; border-bottom: 1px solid #232734; }
  .vrow .vname { color: var(--accent); font-size: 12px; }
  .vrow.changed .vname { color: var(--changed-text); font-weight: 700; }
  .prov { font-size: 10.5px; color: var(--dim); margin: 1px 0 3px 0;
    line-height: 1.5; }
  .prov .provlink { background: none; border: 0; font: inherit; padding: 0;
    color: var(--accent); cursor: pointer; text-decoration: underline dotted; }
  .prov .provlink:hover { color: var(--changed-text); }
  .prov .provslice { background: none; border: 1px solid var(--border);
    border-radius: 4px; font: inherit; font-size: 10px; padding: 0 5px;
    margin-left: 6px; color: var(--call); cursor: pointer; }
  .prov .provslice:hover { border-color: var(--call); }
  #smarks { position: relative; height: 7px; margin: 0 7px 2px; }
  .smark { position: absolute; top: 0; width: 3px; height: 7px;
    background: var(--call); border-radius: 1px; cursor: pointer; }
  .smark:hover { background: #b2f0bb; }
  #slicebar { display: none; padding: 4px 14px; background: #17251b;
    color: var(--call); font-size: 12px; border-top: 1px solid
    var(--border); }
  #slicebar b { color: var(--text); }
  #slicebar .sfront { color: var(--warn); text-decoration: underline
    dotted; cursor: help; }
  #slicebar button { margin-left: 10px; padding: 0 8px; font-size: 11px; }
  .vval { overflow-x: auto; white-space: nowrap; padding-top: 3px; }
  .pv { word-break: break-all; }
  .pv.str { color: #a8d08a; }
  .pv.vchanged { background: var(--changed-bg); color: var(--changed-text);
                 border-radius: 3px; padding: 0 3px; }
  .cont { display: inline-flex; gap: 3px; align-items: flex-start;
          vertical-align: top; }
  .cont.dict { display: inline-block; }
  .cell { display: inline-flex; flex-direction: column; align-items: center;
          border: 1px solid #343a4c; border-radius: 4px; padding: 2px 7px;
          background: #232838; min-width: 22px; }
  .cell.changed { border-color: var(--changed-text);
                  background: var(--changed-bg); color: var(--changed-text); }
  .cell .idx { font-size: 9px; color: var(--dim); margin-top: 2px;
               user-select: none; }
  .cell.more { color: var(--dim); font-style: italic; justify-content: center; }
  .tuple > .cell { border-radius: 11px; }
  .set > .cell { border-style: dashed; }
  .drow { display: flex; gap: 10px; padding: 1px 2px; }
  .drow .dkey { color: #c792ea; }
  .drow.changed { background: var(--changed-bg); border-radius: 3px; }
  .drow.changed .dkey { color: var(--changed-text); }
  .drow.more { color: var(--dim); font-style: italic; }
  .viewsel, .ovsel {
    float: right; background: #262b38; color: var(--dim);
    border: 1px solid var(--border); border-radius: 4px; font: inherit;
    font-size: 10px; padding: 0 2px; margin-left: 4px;
  }
  .vnav {
    float: right; display: inline-flex; align-items: center; gap: 2px;
    margin-left: 6px;
  }
  .vnav button { padding: 0 6px; font-size: 11px; line-height: 15px; }
  .vcount {
    color: var(--dim); font-size: 10px; cursor: pointer;
    min-width: 30px; text-align: center; user-select: none;
  }
  .vcount:hover { color: var(--accent); text-decoration: underline; }
  .vstrip {
    position: relative; height: 9px; background: #20242f;
    border-radius: 3px; margin: 4px 0 2px;
  }
  .vtick {
    position: absolute; top: 1px; width: 3px; height: 7px;
    background: var(--accent); border-radius: 1px;
    transform: translateX(-1px); cursor: pointer;
  }
  .vtick.birth { background: var(--call); }
  .vtick.cur { background: var(--changed-text); width: 5px; }
  .vtick:hover { background: #fff; }
  .gnodeg.vis circle { fill: #1d4430; stroke: #7ee08a; }
  .gnodeg.fresh circle { stroke: var(--changed-text); stroke-width: 2.8; }
  .gbadge {
    fill: #9fd8ff; font-size: 10px; font-weight: 600; text-anchor: middle;
    paint-order: stroke; stroke: #1c2130; stroke-width: 3px;
  }
  .gbadge.bnew { fill: var(--changed-text); }
  table.grid { border-collapse: collapse; margin-top: 2px; }
  table.grid th {
    color: var(--dim); font-size: 9px; font-weight: 400; padding: 1px 5px;
    text-align: center; user-select: none;
  }
  table.grid td.gcell {
    border: 1px solid #343a4c; background: #232838; padding: 2px 7px;
    text-align: center;
  }
  table.grid td.gcell.changed {
    border-color: var(--changed-text); background: var(--changed-bg);
    color: var(--changed-text);
  }
  td.gmore, .gmore {
    color: var(--dim); font-style: italic; font-size: 11px; padding: 0 4px;
  }
  .barbox { display: inline-flex; align-items: flex-end; gap: 2px;
            min-height: 60px; }
  .bar { display: inline-block; width: 9px; background: var(--accent);
         border-radius: 2px 2px 0 0; }
  .bar.neg { background: var(--ret); }
  .bar.changed { background: var(--changed-text); }
  .bar.inf { border-top: 2px dashed var(--text); opacity: .75; }
  .bar.nan { background: repeating-linear-gradient(45deg, #555 0 2px,
             #333 2px 4px); }
  .bscale { color: var(--dim); font-size: 10px; align-self: flex-start;
            margin-left: 6px; user-select: none; }
  table.grid th.changed, table.grid td.gmore.changed {
    color: var(--changed-text); font-weight: 700; font-style: normal;
  }
  svg.graphview {
    background: #1c2130; border: 1px solid var(--border);
    border-radius: 6px; margin-top: 3px;
  }
  .gedge { stroke: #93a1c0; stroke-width: 1.6; }
  .gedge.changed { stroke: var(--changed-text); stroke-width: 2.6; }
  .gnodeg circle { fill: #303a55; stroke: #9db0d8; stroke-width: 1.8; }
  .gnodeg.changed circle { stroke: var(--changed-text); stroke-width: 2.6;
                           fill: #3d3320; }
  .gnodeg text {
    fill: #f0f3fa; font-size: 12px; font-weight: 600; text-anchor: middle;
    paint-order: stroke; stroke: #1c2130; stroke-width: 3px;
  }
  .gnodeg.changed text { fill: var(--changed-text); }
  .gw {
    fill: #e8edf8; font-size: 11px; font-weight: 600; text-anchor: middle;
    paint-order: stroke; stroke: #1c2130; stroke-width: 3.5px;
  }
  .gnote { color: var(--dim); font-style: italic; font-size: 11px;
           padding: 2px 0; }
  footer {
    padding: 8px 14px; background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #scrub { width: 100%; accent-color: var(--accent); }
  .empty { color: var(--dim); font-style: italic; }
  #template-note {
    display: none; padding: 40px; font-size: 15px; line-height: 2;
  }
  #template-note code { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>pyreplay <span id="script-name"></span></h1>
  <div class="controls">
    <button id="btn-first" title="Jump to start (Home)">&#9198; Start</button>
    <button id="btn-prev"  title="One event back (&#8592;)">&#9664; Back</button>
    <button id="btn-next" class="primary" title="One event forward (&#8594;)">Step &#9654;</button>
    <button id="btn-over" title="Step over — skip nested calls, stay in this frame (O)">Over &#10549;</button>
    <button id="btn-out" title="Step out — jump to the caller's next event (U)">Out &#10548;</button>
    <button id="btn-play"  title="Auto-advance on/off (Space)">&#9654; Play</button>

<!-- Trace data lives in a non-executing JSON tag: a bad payload can never
     kill the viewer's JavaScript, and the raw template stays valid. -->
<script id="trace-data" type="application/json">__TRACE_DATA__</script>
<!-- __TRACE_CHUNKS__ -->
<!-- Past ~200k events the writer swaps the events array for gzip+base64
     chunk tags here (#101): the browser never parses one giant string,
     files shrink ~5x, and the loader shows its progress honestly. -->

<script>
const $ = id => document.getElementById(id);

/* Any uncaught error becomes a visible banner instead of dead buttons. */
window.addEventListener("unhandledrejection", ev => {
  const b = document.getElementById("banner");
  b.style.display = "block";
  b.textContent = "Viewer error during load: " +
    (ev.reason && ev.reason.message || ev.reason) +
    " — please report this message.";
});
window.onerror = function (msg, src, lineno) {
  const b = $("banner");
  b.style.display = "block";
  b.textContent = "Viewer error: " + msg + " (line " + lineno + ")\n" +
    "Please report this message.";
  return false;
};

const raw = $("trace-data").textContent.trim();
if (raw.indexOf("__TRACE" + "_DATA__") === 0) {
  $("template-note").style.display = "block";
  document.querySelector("main").style.display = "none";
  throw new Error("template opened directly — no trace data embedded");
}
let DATA;
try {
  DATA = JSON.parse(raw);
} catch (e) {
  throw new Error("trace data is corrupt: " + e.message);
}

/* #101 chunked traces: past ~200k events the writer stores the events
   as gzip+base64 chunk tags instead of one giant JSON string. Loading
   is async (DecompressionStream), with progress in the banner and a
   LOUD note if a chunk is missing — so the whole viewer boots inside
   one async wrapper; nothing below runs before the events exist. */
let chunkDamage = null;
async function loadChunks() {
  const meta = DATA.chunked;
  const b = $("banner");
  b.className = "info";
  b.style.display = "block";
  if (typeof DecompressionStream === "undefined") {
    b.textContent = "This trace is chunked (gzip) but this browser " +
      "lacks DecompressionStream — needs Chrome 80+ / Firefox 113+ / " +
      "Safari 16.4+.";
    throw new Error("no DecompressionStream");
  }
  const out = [];
  for (let k = 0; k < meta.chunks; k++) {
    const tag = document.getElementById("trace-chunk-" + k);
    if (!tag) {
      chunkDamage = "chunk " + (k + 1) + " of " + meta.chunks +
        " is MISSING — file damaged; showing the " + out.length +
        " events before the gap, which end there honestly.";
      break;
    }
    b.textContent = "decompressing events — chunk " + (k + 1) + " / " +
      meta.chunks + " …";
    const bytes = Uint8Array.from(atob(tag.textContent.trim()),
                                  c => c.charCodeAt(0));
    tag.textContent = "";   // free the base64 string immediately
    const text = await new Response(
      new Blob([bytes]).stream().pipeThrough(
        new DecompressionStream("gzip"))).text();
    for (const e of JSON.parse(text)) out.push(e);
  }
  if (!chunkDamage) {
    b.textContent = "";
    b.style.display = "none";
    b.className = "";
  }
  return out;
}

(async () => {
let events = DATA.events;
if (DATA.chunked) events = await loadChunks();

$("script-name").textContent = "· " + DATA.script + " · " +
  events.length + " events" +
  (DATA.granularity === "fn" ? " · fn granularity" : "") +
  (DATA.chunked ? " · " + DATA.chunked.chunks + " gzip chunks" : "");
/* #104: the reproducibility capsule — the trace carries what would let
   anyone make this run happen again; shown, copyable, downloadable */
if (DATA.capsule) {
  const c = DATA.capsule;
  const box = $("capsule");
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let h = "<code>" + esc(c.cmd) +
    (c.stdin ? " &lt; stdin.bin" : "") + "</code>" +
    "<div>" + esc(c.when) + " · in " + esc(c.cwd) + "</div>" +
    "<div>python " + esc(c.python) + " · " + esc(c.platform) + "</div>" +
    "<div>PYTHONHASHSEED " + esc(c.hashseed) +
    (c.hashseed === "random"
      ? " — set/dict iteration order may differ on rerun " +
        "(--runs measures it; a fixed seed pins it)" : "") + "</div>";
  for (const k in (c.env || {}))
    h += "<div>" + esc(k) + "=" + esc(c.env[k]) + "</div>";
  h += "<div>env beyond these keys deliberately not captured.</div>";
  if (c.stdin && c.stdinTrunc)
    h += "<div>⚠ stdin copy truncated to 64 KB — the run consumed " +
      "more; rerun needs the original.</div>";
  box.innerHTML = h;
  const cp = document.createElement("button");
  cp.textContent = "copy command";
  cp.onclick = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(c.cmd);
  };
  box.appendChild(cp);
  if (c.stdin) {
    const dl = document.createElement("button");
    dl.textContent = "download stdin.bin";
    dl.onclick = () => {
      const bytes = Uint8Array.from(atob(c.stdin),
                                    ch => ch.charCodeAt(0));
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([bytes]));
      a.download = "stdin.bin";
      a.click();
      URL.revokeObjectURL(a.href);
    };
    box.appendChild(dl);
  }
}
if (DATA.error || DATA.truncated) {
  const b = $("banner");
  b.style.display = "block";
  b.textContent = (DATA.error ? "Run ended with " + DATA.error + ". " : "") +
    (DATA.truncated ? "Trace truncated at event cap." : "") +
    " The trace up to that point is fully replayable.";
} else if (DATA.startAt) {
  const b = $("banner");
  b.className = "info";
  b.style.display = "block";
  b.textContent = "⚡ Recording began at trigger [" + DATA.startAt +
    "] — everything before it ran normally but is NOT in this trace. " +
    "The first events reconstruct the call stack and variables at that moment.";
}
/* #103 flight recorder: say what the window forgot */
if (DATA.ring && DATA.ring.dropped > 0) {
  const b = $("banner");
  if (!b.style.display || b.style.display === "none") {
    b.className = "info";
    b.style.display = "block";
  }
  const rn = document.createElement("span");
  rn.textContent = " ⟲ flight recorder — the first " +
    DATA.ring.dropped.toLocaleString() + " events rotated out of the " +
    DATA.ring.size.toLocaleString() + "-event ring; the film starts " +
    "mid-run.";
  b.appendChild(rn);
}
/* #89: the critical path — the chain that determined wall time */
if (DATA.critical) {
  const b = $("banner");
  if (!b.style.display || b.style.display === "none") {
    b.className = "info";
    b.style.display = "block";
  }
  const c = DATA.critical;
  const s = document.createElement("span");
  s.textContent = " ★ critical path: " + c.n + " slice(s) across " +
    c.lanes + " lane(s) determined the " +
    (c.spanUs < 1e6 ? (c.spanUs / 1000).toFixed(1) + " ms"
                    : (c.spanUs / 1e6).toFixed(2) + " s") + " run" +
    (c.gapUs > 0
      ? " — " + (c.gapUs / 1000).toFixed(1) + " ms of it untracked " +
        "external waits (sleep/network/OS), attributed to the gap's edges"
      : "") +
    ". Gold pins walk it; speeding up anything else is wasted work.";
  b.appendChild(s);
}
/* #73: every invariant reports its verdict — violated with a jump,
   held everywhere evaluable, or never evaluable (the typo case) */
if (DATA.invariants) {
  const b = $("banner");
  if (!b.style.display || b.style.display === "none") {
    b.className = "info";
    b.style.display = "block";
  }
  DATA.invariants.forEach(iv => {
    const s = document.createElement("span");
    if (!iv.evals) {
      s.textContent = " ⚖ invariant [" + iv.src + "] was never " +
        "evaluable anywhere — probably a typo.";
    } else if (iv.n) {
      s.className = "tripnote";
      s.textContent = " ⚖ invariant [" + iv.src + "] VIOLATED " + iv.n +
        "× — first at event " + (iv.first + 1) + ". Click to jump.";
      s.onclick = () => { stop(); goto(iv.first); };
    } else {
      s.textContent = " ⚖ invariant [" + iv.src + "] held everywhere " +
        "it was evaluable.";
    }
    b.appendChild(s);
  });
}
/* #68 chaos: a perturbed run must say so, loudly (constitution rule 4) */
if (DATA.chaos) {
  const b = $("banner");
  if (!b.style.display || b.style.display === "none") {
    b.className = "info";
    b.style.display = "block";
  }
  const cn = document.createElement("span");
  const n1 = (n, w) => n + " " + w + (n === 1 ? "" : "s");
  cn.textContent = " ⚡ PERTURBED — schedule chaos (seed " +
    DATA.chaos.seed + "): " + n1(DATA.chaos.delays, "stall") + ", " +
    n1(DATA.chaos.yields, "GIL yield") + ", " +
    n1(DATA.chaos.switchRolls, "switch-interval roll") +
    (DATA.chaos.asyncioHooked
      ? ", " + n1(DATA.chaos.shuffles, "ready-queue shuffle")
      : "") +
    " — interleavings explored on purpose; timings are not " +
    "performance truth.";
  b.appendChild(cn);
}
/* a chunked file missing a chunk: after the error/trigger banner text
   is set (textContent assignments above would erase an earlier note) */
if (chunkDamage) {
  const b = $("banner");
  b.style.display = "block";
  const dmg = document.createElement("span");
  dmg.textContent = " ⚠ " + chunkDamage;
  b.appendChild(dmg);
}
/* NaN/Inf tripwire (--trip nan): announce the FIRST birth loudly.
   Appended after the error/trigger text (textContent above would erase
   a child added earlier), clickable to jump to the moment. */
if (DATA.trip) {
  const ft = events.findIndex(e => e.trip);
  const b = $("banner");
  if (!b.style.display || b.style.display === "none") {
    b.className = "info";
    b.style.display = "block";
  }
  const note = document.createElement("span");
  if (ft >= 0) {
    const t0 = events[ft].trip[0];
    note.className = "tripnote";
    note.textContent = " ☢ first " + (t0.k === "nan" ? "NaN" : "Inf") +
      " born at event " + (ft + 1) + " — " +
      (t0.v === "<return>" ? "returned by " + events[ft].fn + "()"
                           : t0.v + " in " + events[ft].fn) +
      " (" + events[ft].f + ":" + events[ft].l + "). Click to jump.";
    note.onclick = () => { stop(); goto(ft); };
  } else {
    note.textContent = " ☢ tripwire armed — no NaN/Inf appeared in any " +
      "recorded value.";
  }
  b.appendChild(note);
}
/* #118 the console lane: every stdout/stderr line the run wrote,
   tied to its moment. Built once; render() only moves the cursor. */
const logIdx = [];
events.forEach((e, i) => { if (e.e === "log") logIdx.push(i); });
let logPos = -1;   // index into logIdx of the last line at/before idx
if (logIdx.length) {
  const sec = $("consec");
  sec.style.display = "";
  $("constat").textContent = logIdx.length + " line" +
    (logIdx.length === 1 ? "" : "s") +
    (DATA.logCapped ? " — recording CAPPED; later output not here" : "");
  const box = $("console");
  logIdx.forEach(i => {
    const e = events[i];
    const d = document.createElement("div");
    let cls = "clog " + (e.s === "err" ? "err" : "out");
    if (/\b(ERROR|CRITICAL|FATAL|Traceback)\b/.test(e.txt))
      cls += " lvl-error";
    else if (/\bWARN(ING)?\b/i.test(e.txt)) cls += " lvl-warn";
    d.className = cls;
    d.textContent = e.txt || " ";
    d.title = (e.s === "err" ? "stderr" : "stdout") +
      (e.f ? " — written at " + e.f + ":" + e.l + " in " + e.fn : "") +
      " (event " + (i + 1) + ", click to jump)";
    d.onclick = () => { stop(); goto(i); };
    box.appendChild(d);
  });
}
function renderConsole() {
  if (!logIdx.length) return;
  let lo = 0, hi = logIdx.length - 1, p = -1;
  while (lo <= hi) {   // last log line at or before the cursor
    const mid = (lo + hi) >> 1;
    if (logIdx[mid] <= idx) { p = mid; lo = mid + 1; } else hi = mid - 1;
  }
  if (p === logPos) return;
  const rows = $("console").children;
  const a = Math.min(logPos < 0 ? 0 : logPos, p < 0 ? 0 : p);
  const b = Math.max(logPos, p);
  for (let k = a; k <= b && k < rows.length; k++) {
    if (k < 0) continue;
    rows[k].classList.toggle("past", k <= p);
    rows[k].classList.remove("cur");
  }
  if (p >= 0) {
    rows[p].classList.add("cur");
    rows[p].scrollIntoView({ block: "nearest" });
  }
  logPos = p;
}

/* #98 per-test chapters: spans from the chap events, an index from
   event -> owning test, a banner summary, and (when the suite had both
   outcomes) the #65 suspects as clickable jumps. */
const chapSpans = [];
const chapterOf = new Array(events.length).fill(-1);
(function () {
  const open = Object.create(null);
  events.forEach((e, i) => {
    if (e.e !== "chap") return;
    if (e.k === "s") { open[e.id] = i; return; }
    const s = open[e.id];
    if (s === undefined) return;
    delete open[e.id];
    chapSpans.push({ id: e.id, o: e.o || "passed", s, t: i });
  });
  chapSpans.forEach((sp, k) => {
    for (let i = sp.s; i <= sp.t; i++) chapterOf[i] = k;
  });
  if (!chapSpans.length) return;
  const n = { passed: 0, failed: 0, skipped: 0, other: 0 };
  chapSpans.forEach(sp => {
    n[sp.o in n ? sp.o : "other"] += 1;
  });
  const b = $("banner");
  if (!b.style.display || b.style.display === "none") {
    b.className = "info";
    b.style.display = "block";
  }
  const sum = document.createElement("span");
  sum.textContent = " " + chapSpans.length + " tests: " + n.passed +
    " ✓" + (n.failed ? " · " + n.failed + " ✗" : "") +
    (n.other ? " · " + n.other + " errored" : "") +
    (n.skipped ? " · " + n.skipped + " −" : "") + ".";
  b.appendChild(sum);
  const S = DATA.testSuspicion;
  if (S && S.top && S.top.length) {
    const lbl = document.createElement("span");
    lbl.textContent = " Suspects (Ochiai, correlation not causation):";
    b.appendChild(lbl);
    S.top.slice(0, 3).forEach(row => {
      const a = document.createElement("span");
      a.className = "suspectlink";
      a.textContent = row.f + ":" + row.l + " (" +
        row.score.toFixed(2) + ")";
      a.title = "executed by " + row.ef + "/" + S.fail +
        " failing vs " + row.ep + "/" + S.pass +
        " passing tests — click to jump into a failing test";
      if (row.ev !== null && row.ev !== undefined)
        a.onclick = () => { stop(); goto(row.ev); };
      b.appendChild(a);
    });
  }
})();

/* ---------- code panes: one pre-rendered pane per source file ---------- */
const panes = {};
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
const esc2 = escapeHtml;
for (const [rel, text] of Object.entries(DATA.sources)) {
  const pane = document.createElement("div");
  pane.style.display = "none";
  const lines = text.replace(/\n$/, "").split("\n");
  const lineEls = lines.map((src, i) => {
    const div = document.createElement("div");
    div.className = "ln";
    div.innerHTML = '<span class="no">' + (i + 1) + '</span><span class="src">'
      + (escapeHtml(src) || " ") + "</span>";
    pane.appendChild(div);
    return div;
  });
  $("code").appendChild(pane);
  panes[rel] = { pane, lineEls };

  const tab = document.createElement("div");
  tab.className = "tab";
  tab.textContent = rel;
  tab.onclick = () => activateFile(rel);
  $("tabs").appendChild(tab);
  panes[rel].tab = tab;
}

/* #77 whyline: click a line NUMBER. An executed line jumps to its
   first execution; a never-run line gets its causal chain — which
   guard decided against it, how often that guard ran, how it voted —
   walked upward one controller at a time. Line granularity only
   (at fn granularity most lines are legitimately unrecorded). */
const execAt = Object.create(null);   // "file|line" -> [event indices]
events.forEach((e, i) => {
  if (e.f && e.l) {
    const k = e.f + "|" + e.l;
    (execAt[k] || (execAt[k] = [])).push(i);
  }
});
if (DATA.granularity === "line") {
  for (const rel in panes) {
    const g = (DATA.guards || {})[rel] || {};
    const src = DATA.sources[rel].split("\n");
    panes[rel].lineEls.forEach((el, i) => {
      const code = (src[i] || "").trim();
      // bare headers (else:/try:/finally:) never emit events even
      // when their bodies run — a strike-through there would lie
      if (code && !code.startsWith("#")
          && !/^(else|try|finally)\s*:/.test(code)
          && !execAt[rel + "|" + (i + 1)])
        el.classList.add("dead");
    });
  }
}
const KINDW = { then: "the guard chose against this branch",
  els: "", "else": "the guard was TRUE every time, so the else " +
  "branch never ran", loop: "the loop body never ran",
  loopelse: "the loop never finished cleanly", except: "this handler " +
  "never caught anything", case: "this case never matched",
  def: "the function was never called" };
function whyline(rel, line) {
  const box = $("whyline");
  const esc = escapeHtml;
  const hits = execAt[rel + "|" + line];
  if (hits) {                       // it ran: jump to the first time
    stop(); goto(hits[0]);
    box.innerHTML = "";
    return;
  }
  if (DATA.granularity !== "line") {
    box.innerHTML = '<div class="wl">whyline needs a line-level ' +
      "trace (fn granularity records call boundaries only)</div>";
    return;
  }
  const g = (DATA.guards || {})[rel] || {};
  let h = '<div class="wl"><b>' + esc(rel) + ":" + line +
    " never ran.</b></div>";
  let cur = line, depth = 0;
  while (depth++ < 12) {
    const ctl = g[cur];
    if (!ctl) {
      h += '<div class="wl">…and nothing above it controls that ' +
        "line: the run ended (or crashed) before reaching it, or " +
        "this module was never imported that far.</div>";
      break;
    }
    const gl = ctl[0], kind = ctl[1];
    const arr = execAt[rel + "|" + gl] || [];
    const gsrc = (DATA.sources[rel].split("\n")[gl - 1] || "").trim();
    if (arr.length) {
      let t_ = 0, f_ = 0;
      arr.forEach(i => {
        const c = events[i].cond;
        if (c && "r" in c) { if (c.r) t_++; else f_++; }
      });
      h += '<div class="wl">because the controller at <b>line ' + gl +
        "</b> (" + esc(gsrc.slice(0, 60)) + ") ran <b>" + arr.length +
        "×</b>" + (t_ + f_ ? " — " + t_ + "× true, " + f_ + "× false"
                           : "") +
        " and " + (KINDW[kind] || "never took this path") + "." +
        '<span class="wlj" data-goto="' + arr[0] +
        '">first arrival</span>' +
        (arr.length > 1 ? '<span class="wlj" data-goto="' +
          arr[arr.length - 1] + '">last</span>' : "") + "</div>";
      break;
    }
    h += '<div class="wl">because its controller at <b>line ' + gl +

/* ---------- semantic value rendering ----------
   Values arrive as typed structures: {t: "p"|"s"|"o", v: text} or
   {t: "list"|"tuple"|"set"|"dict", n: realLength, v: elements}.
   renderValue picks a renderer by type — generic for any program's data.
   `old` (the value before this event) enables element-level diffing:
   exactly the cells that changed get highlighted. */
function sig(x) { return JSON.stringify(x); }

const CONT = new Set(["list", "tuple", "set", "dict"]);

/* Hover tooltip: the value's real Python type (+ true size for containers). */
function titleAttr(enc) {
  let label;
  if (enc.t === "obj")
    label = (enc.c || "object") + " · " + enc.n +
      (enc.n === 1 ? " attr" : " attrs");
  else if (CONT.has(enc.t))
    label = (enc.c || enc.t) + " · " + enc.n +
      (enc.n === 1 ? " item" : " items");
  else label = enc.c || enc.t;
  return ' title="' + escapeHtml(label) + '"';
}

/* Highlighting philosophy: mark ONLY the deepest thing that changed.
   If an element is a container of the same type as before, recursion
   marks the leaf inside it; the containing boxes stay unmarked. */
function renderValue(enc, old) {
  if (!enc || typeof enc !== "object") return "";
  if (enc.t === "p" || enc.t === "o" || enc.t === "s") {
    const ch = old !== undefined && sig(old) !== sig(enc) ? " vchanged" : "";
    const cls = enc.t === "s" ? " str" : "";
    const text = enc.t === "s" ? JSON.stringify(enc.v) : String(enc.v);
    return '<span class="pv' + cls + ch + '"' + titleAttr(enc) + ">" +
      escapeHtml(text) + "</span>";
  }
  if (CONT.has(enc.t) && enc.n === 0) {
    const ch = old !== undefined && sig(old) !== sig(enc) ? " vchanged" : "";
    const lit = { list: "[]", tuple: "()", set: "set()", dict: "{}" }[enc.t];
    return '<span class="pv' + ch + '"' + titleAttr(enc) + ">" + lit +
      "</span>";
  }
  if (enc.t === "obj") {
    // nested instances render as an attribute table (top-level object
    // variables get their attributes promoted to real rows instead)
    const sameType = old !== undefined && old.t === "obj";
    const oldMap = {};
    if (sameType) old.v.forEach(p => { oldMap[p[0]] = p[1]; });
    let rows = enc.v.map(([k, v]) => {
      let ch = "", oldItem;
      if (old !== undefined) {
        if (!sameType) ch = " changed";
        else {
          oldItem = oldMap[k];
          if (oldItem === undefined) ch = " changed";
          else if (sig(oldItem) !== sig(v))
            ch = CONT.has(v.t) && oldItem.t === v.t ? "" : " changed";
        }
      }
      return '<div class="drow' + ch + '"><span class="dkey">.' +
        escapeHtml(k) + "</span><span>" + renderValue(v, oldItem) +
        "</span></div>";
    }).join("");
    if (enc.n > enc.v.length)
      rows += '<div class="drow more">+' + (enc.n - enc.v.length) +
        " more</div>";
    return '<span class="cont dict"' + titleAttr(enc) + ">" + rows +
      "</span>";
  }
  if (enc.t === "set") return renderSet(enc, old);
  if (enc.t === "list" || enc.t === "tuple") {
    const off = enc.off || 0;
    const sameType = old !== undefined && old.t === enc.t;
    const oldAbs = {};
    if (sameType) {
      const oldOff = old.off || 0;
      old.v.forEach((it, i) => { oldAbs[oldOff + i] = it; });
    }
    let cells = "";
    if (off > 0)
      cells += '<span class="cell more" title="' + off +
        ' elements before this window">…' + off + "</span>";
    const chi = enc.chi ? new Set(enc.chi) : null;
    cells += enc.v.map((item, i) => {
      const abs = off + i;
      let ch = "", oldItem;
      if (old !== undefined) {
        if (chi) {
          // tracer stamped the changed indices — authoritative
          ch = chi.has(abs) ? " changed" : "";
        } else if (!sameType) ch = " changed";
        else {
          oldItem = oldAbs[abs];
          if (oldItem === undefined) {
            if (abs >= old.n) ch = " changed";   // grew: element is new
            // else: outside the old window — unknown, leave unmarked
          } else if (sig(oldItem) !== sig(item)) {
            ch = CONT.has(item.t) && oldItem.t === item.t
              ? "" : " changed";                 // container: leaf will glow
          }
        }
      }
      const idx = '<span class="idx">' + abs + "</span>";
      return '<span class="cell' + ch + '"' + titleAttr(item) + ">" +
        renderValue(item, oldItem) + idx + "</span>";
    }).join("");
    const after = enc.n - off - enc.v.length;
    if (after > 0)
      cells += '<span class="cell more" title="' + after +
        ' more elements after this window">+' + after + "</span>";
    return '<span class="cont ' + enc.t + '"' + titleAttr(enc) + ">" +
      cells + "</span>";
  }
  if (enc.t === "dict") {
    const sameType = old !== undefined && old.t === "dict";
    const oldMap = {};
    if (sameType) old.v.forEach(p => { oldMap[p[0]] = p[1]; });
    const oldPartial = sameType && old.n > old.v.length;
    let rows = enc.v.map(([k, v], i) => {
      let ch = "", oldItem;
      if (old !== undefined) {
        if (enc.nc !== undefined) {
          // tracer stamped changed-pairs-first — authoritative
          ch = i < enc.nc ? " changed" : "";
        } else if (!sameType) ch = " changed";
        else {
          oldItem = oldMap[k];
          if (oldItem === undefined) {
            // absent from a PARTIAL old encoding = unknown, not new
            ch = oldPartial ? "" : " changed";
          } else if (sig(oldItem) !== sig(v)) {
            ch = CONT.has(v.t) && oldItem.t === v.t
              ? "" : " changed";                             // leaf will glow
          }
        }
      }
      return '<div class="drow' + ch + '"><span class="dkey">' +
        escapeHtml(k) + "</span><span>" + renderValue(v, oldItem) +
        "</span></div>";
    }).join("");
    if (enc.n > enc.v.length)
      rows += '<div class="drow more">+' + (enc.n - enc.v.length) +
        " more</div>";
    return '<span class="cont dict"' + titleAttr(enc) + ">" + rows +
      "</span>";
  }
  return "";
}

/* ---------- alternate views: grid (list-of-lists) and bars (numbers).
   Pure projections of the same data — never an interpretation. The
   per-variable selector offers them only when the shape fits. ---------- */
const VIEW_KEY = "pyreplay-view:" + DATA.script + ":";
function getPref(key, def) {
  try { return localStorage.getItem(VIEW_KEY + key) || def; }
  catch (e) { return def; }
}
function getViewPref(name) { return getPref(name, "cells"); }
function setViewPref(name, view) {
  try { localStorage.setItem(VIEW_KEY + name, view); } catch (e) {}
}
function parseNum(s) {
  if (s === "inf") return Infinity;
  if (s === "-inf") return -Infinity;
  if (s === "nan") return NaN;
  return Number(s);   // NaN on garbled reprs (unlike parseFloat)
}
/* mirror of the tracer's _poison_kind: does this ENCODED value visibly
   hold a NaN/Inf leaf? Used to place the ☢ glyph on exactly the rows
   (incl. promoted attrs) whose displayed value carries the poison. */
function poisonIn(enc) {
  if (!enc || typeof enc !== "object") return null;
  if (enc.t === "p") {
    const v = enc.v;
    if (typeof v !== "string") return null;
    if (v === "nan" || v === "-nan" || v.endsWith("(nan)") ||
        v.endsWith("(-nan)")) return "nan";
    if (v === "inf" || v === "-inf" || v.endsWith("(inf)") ||
        v.endsWith("(-inf)")) return "inf";
    if ((enc.c || "").includes("complex")) {
      if (v.includes("nan")) return "nan";
      if (v.includes("inf")) return "inf";
    }
    return null;
  }
  let kids = [];
  if (["list", "tuple", "set"].includes(enc.t)) kids = enc.v || [];
  else if (["dict", "obj"].includes(enc.t))
    kids = (enc.v || []).map(p => p && p[1]);
  else return null;
  let inf = null;
  for (const k of kids) {
    const r = poisonIn(k);
    if (r === "nan") return "nan";
    if (r === "inf") inf = "inf";
  }
  return inf;
}
function viewOptions(enc) {
  const opts = ["cells"];
  if ((enc.t === "list" || enc.t === "tuple") && enc.v && enc.v.length) {
    if (enc.v.every(x => x && (x.t === "list" || x.t === "tuple")))
      opts.push("grid");
    if (enc.n >= 2 &&
        enc.v.every(x => x && x.t === "p" &&
          (x.c === "int" || x.c === "float") &&
          (x.v === "nan" || !Number.isNaN(parseNum(x.v)))))
      opts.push("bars");
  }
  if (numericScalar(enc)) opts.push("chart");
  opts.push(...graphEligibility(enc));
  return opts;
}
/* the oscilloscope accepts any numeric scalar — including numpy-style
   float subclasses, recognized by their class-name suffix */
function numericScalar(enc) {
  return enc && enc.t === "p" && typeof enc.c === "string" &&
    (enc.c === "int" || enc.c === "float" ||
     /(?:^|\.)(?:int|uint|float)\d*$/.test(enc.c));
}

/* ---------- graph view (Tier 2): heuristics OFFER, the user decides.
   Handles four generic encodings with no algorithm knowledge:
   dict-of-sequences (adjacency by key), dict-of-dicts (weighted
   adjacency), list-of-int-sequences (adjacency by index), and
   list-of-pairs (edge list — offered as a separate "edges" option
   since the shape is ambiguous; the oracle picks). ---------- */
let _gvid = 0;   // unique SVG marker ids when several graphs are on screen

function nodeLabel(enc) {
  // a node id must be a primitive; containers can't name a node
  if (!enc || typeof enc !== "object") return null;
  if (enc.t === "s") return "'" + enc.v + "'";   // match dict-key reprs
  if (enc.t === "p") return String(enc.v);
  return null;
}

function resolveLabel(enc, keySet) {
  // dict keys arrive as Python reprs, elements as raw values; bridge
  // the two spaces so string nodes match their keys
  const l = nodeLabel(enc);
  if (l === null) return null;
  if (enc.t !== "s") return l;
  if (enc.v.endsWith("…")) return null;   // truncated: identity unknowable
  if (!keySet || keySet.has(l)) return l;
  const dq = '"' + enc.v + '"';           // repr switches to double quotes
  return keySet.has(dq) ? dq : l;         // when the raw string contains '
}

function graphEligibility(enc) {
  const out = [];
  try {
    if (enc.t === "dict" && enc.n >= 2 && enc.n <= 60 && enc.v.length) {
      const vals = enc.v.map(p => p[1]);
      if (vals.every(x => x &&
          (x.t === "list" || x.t === "tuple" || x.t === "set"))) {
        // adjacency dict: enough elements must point back at keys
        const keys = new Set(enc.v.map(p => p[0]));
        let total = 0, hits = 0;
        vals.forEach(c => (c.v || []).forEach(e => {
          total++;
          const l = resolveLabel(e, keys);
          if (l !== null && keys.has(l)) hits++;
        }));
        if (total === 0 || hits >= Math.max(1, total * 0.25))
          out.push("graph");
      } else if (vals.every(x => x && x.t === "dict")) {
        out.push("graph");   // weighted adjacency {u: {v: weight}}
      }
    }
    if ((enc.t === "list" || enc.t === "tuple") && enc.n >= 2 &&
        enc.n <= 60 && enc.v.length &&
        enc.v.every(x => x && (x.t === "list" || x.t === "tuple"))) {
      if (adjOrientation(enc) !== null) out.push("graph");
      // edge list: rows of exactly two node ids (ambiguous with the
      // above — offer both, the user knows which one their data is)
      if (enc.v.every(r => r.n === 2 &&
          (r.v || []).every(e => nodeLabel(e) !== null)))
        out.push("edges");
    }
  } catch (err) { /* eligibility must never break rendering */ }
  return out;
}

/* Index-based adjacency comes in two generic shapes: rows of plain ints
   (unweighted) or rows of 2-tuples with the neighbor in a consistent
   position (weighted, e.g. (nbr, w) or (w, nbr)). Detect which — the
   neighbor position is the one that is ALWAYS an int in [0, n). */
function adjOrientation(enc) {
  const inRange = e => {
    if (!e || e.t !== "p" || e.c !== "int") return false;
    const v = Number(e.v);
    return Number.isInteger(v) && v >= 0 && v < enc.n;
  };
  const isPair = e => e && (e.t === "list" || e.t === "tuple") &&
    e.n === 2 && (e.v || []).length === 2;
  let allInt = true, allPair = true, any = false;
  enc.v.forEach(row => (row.v || []).forEach(e => {
    any = true;
    if (!inRange(e)) allInt = false;
    if (!isPair(e)) allPair = false;
  }));
  if (!any) return { nb: -1 };            // empty rows: being built
  if (allInt) return { nb: -1 };          // plain ints, no weights
  if (allPair) {
    let aOk = true, bOk = true;
    enc.v.forEach(row => (row.v || []).forEach(e => {
      if (!inRange(e.v[0])) aOk = false;
      if (!inRange(e.v[1])) bOk = false;
    }));
    if (aOk) return { nb: 0 };            // (neighbor, weight)
    if (bOk) return { nb: 1 };            // (weight, neighbor)
  }
  return null;
}

function graphModel(enc) {
  // normalize any adjacency encoding to {nodes, edges}. "partial" is
  // RECURSIVE: a truncated inner container also means we can't know the
  // full topology (edges hidden beyond an inner head).
  const nodes = [], edges = [], seen = new Set();
  let partial = enc.n > enc.v.length;
  const addNode = l => { if (!seen.has(l)) { seen.add(l); nodes.push(l); } };
  if (enc.t === "dict") {
    const keySet = new Set(enc.v.map(p => p[0]));
    enc.v.forEach(p => addNode(p[0]));
    enc.v.forEach(([k, val]) => {
      if (val && val.n > (val.v ? val.v.length : 0)) partial = true;
      if (val.t === "dict") {
        (val.v || []).forEach(([ik, iv]) => {
          addNode(ik);
          // w = diff identity (sig for containers, so weight changes
          // flash); label = display text (only for scalar weights)
          const scalar = iv && (iv.t === "p" || iv.t === "s");
          edges.push({ a: k, b: ik,
                       w: scalar ? String(iv.v) : (iv ? sig(iv) : ""),
                       label: scalar ? String(iv.v) : "" });
        });
      } else {
        (val.v || []).forEach(e => {
          const l = resolveLabel(e, keySet);
          if (l === null) return;
          addNode(l);
          edges.push({ a: k, b: l, w: "", label: "" });
        });
      }
    });
  } else {
    const off = enc.off || 0;
    const orient = adjOrientation(enc) || { nb: -1 };
    for (let i = 0; i < enc.n; i++) addNode(String(i));
    enc.v.forEach((row, i) => {
      if (row && row.n > (row.v ? row.v.length : 0)) partial = true;
      const a = String(off + i);
      (row.v || []).forEach(e => {
        let nbEnc = e, wEnc = null;
        if (orient.nb >= 0 && e && (e.t === "list" || e.t === "tuple") &&
            (e.v || []).length === 2) {
          nbEnc = e.v[orient.nb];
          wEnc = e.v[1 - orient.nb];
        }
        const l = resolveLabel(nbEnc, null);
        if (l === null) return;
        addNode(l);
        const scalar = wEnc && (wEnc.t === "p" || wEnc.t === "s");
        edges.push({ a, b: l,
                     w: scalar ? String(wEnc.v) : (wEnc ? sig(wEnc) : ""),
                     label: scalar ? String(wEnc.v) : "" });
      });
    });
  }
  return { nodes, edges, partial };
}

function edgeModel(enc) {
  // list of [u, v] (or [u, v, w]) pairs
  const nodes = [], edges = [], seen = new Set();
  let partial = enc.n > enc.v.length;
  const addNode = l => { if (!seen.has(l)) { seen.add(l); nodes.push(l); } };
  enc.v.forEach(row => {
    if (row && row.n > (row.v ? row.v.length : 0)) partial = true;
    const a = nodeLabel(row.v && row.v[0]);
    const b = nodeLabel(row.v && row.v[1]);
    if (a === null || b === null) return;
    addNode(a); addNode(b);
    const wEnc = row.v.length > 2 ? row.v[2] : null;
    const scalar = wEnc && (wEnc.t === "p" || wEnc.t === "s");
    edges.push({ a, b,
                 w: scalar ? String(wEnc.v) : (wEnc ? sig(wEnc) : ""),
                 label: scalar ? String(wEnc.v) : "" });
  });
  return { nodes, edges, partial };
}

/* ---------- traversal overlay: color the graph by ANOTHER variable.
   Generic interpretations by shape — no algorithm knowledge:
   set   -> membership (visited nodes green, newly added flash)
   dict  -> membership + scalar values as badges under the nodes

            are indices (badges: D[i] under node i, changed ones flash);
            otherwise a collection of node ids (queue/path membership) */
function overlayMaps(ov, nodeList) {
  const enc = ov.enc, old = ov.old;
  if (!enc || typeof enc !== "object") return null;
  const member = new Set(), fresh = new Set();
  const badge = new Map(), badgeNew = new Set();
  const nodeSet = new Set(nodeList);
  if (enc.t === "set") {
    const oldSigs = old !== undefined && old.t === "set"
      ? new Set((old.v || []).map(sig)) : null;
    (enc.v || []).forEach(e => {
      const l = resolveLabel(e, nodeSet);
      if (l === null || !nodeSet.has(l)) return;
      member.add(l);
      if (oldSigs && !oldSigs.has(sig(e))) fresh.add(l);
    });

  }
  if (enc.t === "dict") {
    const oldMap = {};
    if (old !== undefined && old.t === "dict")
      (old.v || []).forEach(p => { oldMap[p[0]] = p[1]; });
    (enc.v || []).forEach(([k, v]) => {
      if (!nodeSet.has(k)) return;
      member.add(k);
      if (v && (v.t === "p" || v.t === "s")) badge.set(k, String(v.v));
      if (old !== undefined && old.t === "dict") {
        const o = oldMap[k];
        if (o === undefined) fresh.add(k);
        else if (sig(o) !== sig(v)) badgeNew.add(k);
      }
    });
    return { member, fresh, badge, badgeNew };
  }
  if (enc.t === "list" || enc.t === "tuple") {
    const off = enc.off || 0;
    const numericNodes = nodeList.every(l => /^\d+$/.test(l));
    if (numericNodes && enc.n === nodeList.length) {
      // value array indexed by node: badge every node with its value
      const oldAbs = {};
      if (old !== undefined && old.t === enc.t) {
        const oo = old.off || 0;
        (old.v || []).forEach((it, i) => { oldAbs[oo + i] = it; });
      }
      const chi = enc.chi ? new Set(enc.chi) : null;
      (enc.v || []).forEach((e, i) => {
        const abs = off + i, l = String(abs);
        if (!nodeSet.has(l)) return;
        if (e && (e.t === "p" || e.t === "s")) badge.set(l, String(e.v));
        if (old !== undefined) {
          if (chi ? chi.has(abs)
              : (oldAbs[abs] !== undefined && sig(oldAbs[abs]) !== sig(e)))
            badgeNew.add(l);
        }
      });
      return { member, fresh, badge, badgeNew };
    }
    // collection of node ids: queue / stack / path membership
    const oldSigs = old !== undefined && old.t === enc.t
      ? new Set((old.v || []).map(sig)) : null;
    (enc.v || []).forEach(e => {
      const l = resolveLabel(e, nodeSet);
      if (l === null || !nodeSet.has(l)) return;
      member.add(l);
      if (oldSigs && !oldSigs.has(sig(e))) fresh.add(l);
    });
    return { member, fresh, badge, badgeNew };
  }

}

function renderGraph(enc, old, mode, ov) {
  const model = mode === "edges" ? edgeModel(enc) : graphModel(enc);
  if (!model.nodes.length) return renderValue(enc, old);
  if (model.nodes.length > 80)
    return '<div class="gnote">graph too large to draw (' +
      model.nodes.length + " nodes) — showing cells</div>" +
      renderValue(enc, old);
  let ovm = null;
  if (ov) {
    try { ovm = overlayMaps(ov, model.nodes); } catch (err) { ovm = null; }
  }

  // diff: an edge/node is "changed" if absent from the previous model.
  // Only sound when BOTH models are complete (recursively) — a partial
  // encoding on either side = unknown = no marks. Duplicate edges are
  // diffed as a multiset so an appended parallel edge still flashes.
  let oldEdges = null, oldNodes = null;
  let markAll = false;
  if (old !== undefined) {
    if (old.t !== enc.t) markAll = true;
    else {
      try {
        const om = mode === "edges" ? edgeModel(old) : graphModel(old);
        if (!om.partial && !model.partial) {
          const seenOld = {};
          oldEdges = new Set(om.edges.map(e => {
            const k = e.a + "→" + e.b + "|" + e.w;
            const c = seenOld[k] = (seenOld[k] || 0) + 1;
            return k + "#" + c;
          }));
          oldNodes = new Set(om.nodes);
        }
      } catch (err) { /* unknown → unmarked */ }
    }
  }
