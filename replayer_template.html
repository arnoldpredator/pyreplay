  const R = Math.min(240, Math.max(46, N * 10));
  const nr = Math.max(7, Math.min(13,
    Math.floor((2 * Math.PI * R) / (N * 3.4))));
  const pad = nr + (ovm && ovm.badge.size ? 34 : 22);
  const cx = R + pad, cy = R + pad, S = 2 * (R + pad);
  const pos = {};
  model.nodes.forEach((l, i) => {
    const ang = -Math.PI / 2 + (2 * Math.PI * i) / N;
    pos[l] = [cx + R * Math.cos(ang), cy + R * Math.sin(ang)];
  });

  const id = "gv" + (++_gvid);
  const arrow = c =>
    '<marker id="' + id + c + '" viewBox="0 0 10 10" refX="9" refY="5" ' +
    'markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M0,0 L10,5 L0,10 z" fill="' +
    (c === "c" ? "#ffd479" : "#93a1c0") + '"/></marker>';
  let svg = '<svg class="graphview" width="' + S + '" height="' + S +
    '"><defs>' + arrow("a") + arrow("c") + "</defs>";

  const ekeys = new Set(model.edges.map(e => e.a + "→" + e.b));
  const occDiff = {};   // multiset occurrence counter for diffing
  const occGeom = {};   // parallel-edge counter for drawing offsets
  model.edges.forEach(e => {
    const dk = e.a + "→" + e.b + "|" + e.w;
    const c = occDiff[dk] = (occDiff[dk] || 0) + 1;
    const ch = markAll ||
      (oldEdges !== null && !oldEdges.has(dk + "#" + c));
    const cls = "gedge" + (ch ? " changed" : "");
    const mk = ' marker-end="url(#' + id + (ch ? "c" : "a") + ')"';
    const tip = "<title>" + escapeHtml(e.a + " → " + e.b +
      (e.label ? "  (" + e.label + ")" : "")) + "</title>";
    const [xa, ya] = pos[e.a], [xb, yb] = pos[e.b];
    if (e.a === e.b) {   // self-loop: small arc above the node
      svg += '<path class="' + cls + '" fill="none" d="M ' +
        (xa - nr * 0.6) + " " + (ya - nr * 0.8) + " a " + nr * 0.8 + " " +
        nr * 0.8 + " 0 1 1 " + nr * 1.2 + ' 0"' + mk + ">" + tip + "</path>";
      return;
    }
    let dx = xb - xa, dy = yb - ya;
    const d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;
    // reciprocal edges offset perpendicular; parallel duplicates fan out
    const gi = (occGeom[e.a + "→" + e.b] =
      (occGeom[e.a + "→" + e.b] || 0) + 1) - 1;
    const offp = (ekeys.has(e.b + "→" + e.a) ? 3.5 : 0) + gi * 5;
    const px = -dy * offp, py = dx * offp;
    // clamp trims so short chords never produce a reversed segment
    const trimA = nr, trimB = nr + 5;
    const sc = Math.min(1, Math.max(0, (d - 1) / (trimA + trimB)));
    const x1 = xa + dx * trimA * sc + px, y1 = ya + dy * trimA * sc + py;
    const x2 = xb - dx * trimB * sc + px, y2 = yb - dy * trimB * sc + py;
    svg += '<line class="' + cls + '" x1="' + x1 + '" y1="' + y1 +
      '" x2="' + x2 + '" y2="' + y2 + '"' + mk + ">" + tip + "</line>";
    if (e.label)
      svg += '<text class="gw" x="' + ((x1 + x2) / 2 - dy * 8) + '" y="' +
        ((y1 + y2) / 2 + dx * 8) + '">' + escapeHtml(e.label) + "</text>";
  });

  model.nodes.forEach(l => {
    const ch = markAll || (oldNodes !== null && !oldNodes.has(l));
    const vis = ovm && ovm.member.has(l);
    const fresh = ovm && ovm.fresh.has(l);
    const [x, y] = pos[l];
    const disp = l.replace(/^'(.*)'$/, "$1");
    const short = disp.length > 6 ? disp.slice(0, 5) + "…" : disp;
    svg += '<g class="gnodeg' + (ch ? " changed" : "") +
      (vis ? " vis" : "") + (fresh ? " fresh" : "") + '"><circle cx="' +
      x + '" cy="' + y + '" r="' + nr + '"/><text x="' + x + '" y="' +
      (y + 3) + '">' + escapeHtml(short) + "</text><title>" +
      escapeHtml(disp) + "</title></g>";
    if (ovm && ovm.badge.has(l))
      svg += '<text class="gbadge' +
        (ovm.badgeNew.has(l) ? " bnew" : "") + '" x="' + x + '" y="' +
        (y + nr + 13) + '">' + escapeHtml(ovm.badge.get(l)) + "</text>";
  });
  svg += "</svg>";
  return svg + (model.partial
    ? '<div class="gnote">⚠ container truncated — some nodes/edges ' +
      "may be missing</div>" : "");
}

/* Shared helper: change state of element at absolute index, honoring
   authoritative chi markers and window alignment (same rules as cells). */
function elemChange(item, abs, old, oldAbs, sameType, chi) {
  if (old === undefined) return { ch: false, oldItem: undefined };
  if (chi) return { ch: chi.has(abs), oldItem: oldAbs[abs] };
  if (!sameType) return { ch: true, oldItem: undefined };
  const oldItem = oldAbs[abs];
  if (oldItem === undefined)
    return { ch: abs >= old.n, oldItem: undefined };
  return { ch: sig(oldItem) !== sig(item), oldItem };
}

function renderGrid(enc, old) {
  const off = enc.off || 0;
  const sameType = old !== undefined && old.t === enc.t;
  const oldAbs = {};
  if (sameType) {
    const oldOff = old.off || 0;
    old.v.forEach((it, i) => { oldAbs[oldOff + i] = it; });
  }
  const chi = enc.chi ? new Set(enc.chi) : null;
  const ncols = Math.max(0, ...enc.v.map(r => (r.v ? r.v.length : 0)));
  let html = '<table class="grid"' + titleAttr(enc) + "><tr><th></th>";
  for (let c = 0; c < ncols; c++) html += "<th>" + c + "</th>";
  html += "</tr>";
  if (off > 0)
    html += '<tr><th>…</th><td class="gmore" colspan="' + (ncols || 1) +
      '">' + off + " rows before</td></tr>";
  enc.v.forEach((row, i) => {
    const abs = off + i;
    const st = elemChange(row, abs, old, oldAbs, sameType, chi);
    let rowHtml = "";
    let anyMarked = false;
    if ((row.t === "list" || row.t === "tuple") && row.v.length) {
      // positional inner diff only against an old row of the SAME type;
      // a retyped row falls back to the row-level verdict on every cell
      const oldCells = st.oldItem && st.oldItem.t === row.t
        ? st.oldItem.v : null;
      row.v.forEach((cell, c) => {
        let ch = false;
        if (old !== undefined) {
          if (oldCells)
            ch = c >= oldCells.length || sig(oldCells[c]) !== sig(cell);
          else ch = st.ch;
        }
        anyMarked = anyMarked || ch;
        rowHtml += '<td class="gcell' + (ch ? " changed" : "") + '"' +
          titleAttr(cell) + ">" + renderValue(cell) + "</td>";
      });
      const hidden = row.n - row.v.length;
      if (hidden > 0) {
        // authoritative row change with all visible cells equal: the
        // change lives beyond the head — mark the "+N" cell
        const hiddenCh = st.ch && !anyMarked;
        anyMarked = anyMarked || hiddenCh;
        rowHtml += '<td class="gmore' + (hiddenCh ? " changed" : "") +
          '">+' + hidden + "</td>";
      }
    } else {
      // empty containers and mixed rows: one spanning cell ("[]" etc.)
      anyMarked = st.ch;
      rowHtml += "<td" + (st.ch ? ' class="gcell changed"' : "") +
        ' colspan="' + (ncols || 1) + '">' +
        renderValue(row, st.oldItem) + "</td>";
    }
    const thCh = st.ch && !anyMarked;   // last resort: mark the row header
    html += "<tr><th" + (thCh ? ' class="changed"' : "") + ">" + abs +
      "</th>" + rowHtml + "</tr>";
  });
  const after = enc.n - off - enc.v.length;
  if (after > 0)
    html += '<tr><th>…</th><td class="gmore" colspan="' + (ncols || 1) +
      '">' + after + " rows after</td></tr>";
  return html + "</table>";
}

function renderBars(enc, old) {
  const off = enc.off || 0;
  const sameType = old !== undefined && old.t === enc.t;
  const oldAbs = {};
  if (sameType) {
    const oldOff = old.off || 0;
    old.v.forEach((it, i) => { oldAbs[oldOff + i] = it; });
  }
  const chi = enc.chi ? new Set(enc.chi) : null;
  const nums = enc.v.map(x => parseNum(x.v));
  let maxAbs = 0;
  nums.forEach(v => { if (isFinite(v)) maxAbs = Math.max(maxAbs, Math.abs(v)); });
  const displayMax = maxAbs;      // true scale, shown in the label
  if (!maxAbs) maxAbs = 1;        // divisor only: avoid 0/0 heights
  let html = '<span class="barbox"' + titleAttr(enc) + ">";
  if (off > 0) html += '<span class="gmore">…' + off + "</span>";
  enc.v.forEach((item, i) => {
    const abs = off + i;
    const st = elemChange(item, abs, old, oldAbs, sameType, chi);
    const v = nums[i];
    let h, extra = "";
    if (v === Infinity || v === -Infinity) { h = 56; extra = " inf"; }
    else if (Number.isNaN(v)) { h = 8; extra = " nan"; }
    else h = Math.max(2, Math.round(Math.abs(v) / maxAbs * 56));
    html += '<span class="bar' + (st.ch ? " changed" : "") +
      (v < 0 ? " neg" : "") + extra + '" style="height:' + h +
      'px" title="[' + abs + "] = " + escapeHtml(String(item.v)) +
      '"></span>';
  });
  const after = enc.n - off - enc.v.length;
  if (after > 0) html += '<span class="gmore">+' + after + "</span>";
  // bars are normalized per event; the scale label makes growth visible
  // (for a monotone accumulator the tallest bar is ALWAYS full height —
  // without the label, growth would be invisible)
  html += '<span class="bscale" title="current bar scale (tallest value)">⤒' +
    escapeHtml(String(displayMax)) + "</span>";
  return html + "</span>";
}

/* ---------- the oscilloscope: value vs event-axis (strip-chart), or
   value vs value (phase portrait) when a partner variable is chosen.
   Pure projection of the change index — the series IS the recorded
   changes, drawn as the step function a variable really is (it holds
   its value between changes). Non-numeric moments are honest gaps;
   NaN/Inf get edge ticks, never fake positions. ---------- */
const CHART_CAP = 2000;   // points drawn; anything older is announced

function numericAt(j, label) {
  // the numeric value label took at change-event j, or null when that
  // change wasn't numeric (a rebind to a string, a del, ...)
  const ev = events[j];
  if (!ev || !ev.ch) return null;
  const base = label.split(".")[0];
  let enc = ev.ch[base];
  if (!enc) return null;
  if (label.includes(".")) {
    if (enc.t !== "obj" || !enc.v) return null;
    const want = label.slice(base.length + 1);
    const pair = enc.v.find(p => p && p[0] === want);
    enc = pair && pair[1];
    if (!enc) return null;
  }
  if (!enc || enc.t !== "p") return null;
  return parseNum(enc.v);   // may be NaN/±Infinity — drawn as such
}

function chartSeries(label, fid) {
  const all = changesFor(label, fid);
  const cut = Math.max(0, all.length - CHART_CAP);
  return { cut, pts: all.slice(cut).map(j => ({ j, n: numericAt(j, label) })) };
}

function svgOpen(h) {
  return '<svg class="chartsvg" viewBox="0 0 460 ' + h +
    '" width="100%" height="' + h + '" preserveAspectRatio="none" ' +
    'xmlns="http://www.w3.org/2000/svg">';
}

function renderChart(label, fid, partner, wantLog) {
  const { cut, pts } = chartSeries(label, fid);
  const finite = pts.filter(p => Number.isFinite(p.n));
  if (!finite.length)
    return '<div class="chartbox"><div class="empty">no numeric ' +
      'values recorded for this variable yet</div></div>';
  if (partner) return renderPhase(label, fid, partner, cut, pts);

  const W = 460, H = 96, PAD = 6;
  const j0 = pts[0].j, j1 = pts[pts.length - 1].j;
  const xOf = j => j1 === j0 ? W / 2
    : PAD + (j - j0) / (j1 - j0) * (W - 2 * PAD);
  const logOK = finite.every(p => p.n > 0);
  const useLog = wantLog && logOK;
  const yv = v => useLog ? Math.log10(v) : v;
  let lo = Infinity, hi = -Infinity;
  finite.forEach(p => { lo = Math.min(lo, yv(p.n)); hi = Math.max(hi, yv(p.n)); });
  if (hi === lo) { hi += 1; lo -= 1; }
  const span = hi - lo;
  const yOf = v => H - PAD - (yv(v) - lo) / span * (H - 2 * PAD);

  let s = svgOpen(H);
  // exception / trip moments inside the chart's event range, aligned
  events.forEach((e, i) => {
    if (i < j0 || i > j1) return;
    if (e.e === "exc" && e.x && !e.x.soft)
      s += '<line x1="' + xOf(i) + '" y1="0" x2="' + xOf(i) +
        '" y2="8" stroke="var(--err)" stroke-width="2"><title>' +
        escapeHtml(e.x.t) + " — event " + (i + 1) + "</title></line>";
    else if (e.trip)
      s += '<line x1="' + xOf(i) + '" y1="0" x2="' + xOf(i) +
        '" y2="8" stroke="#e5c07b" stroke-width="2"><title>☢ event ' +
        (i + 1) + "</title></line>";
  });
  // the cursor: where the replay stands now
  const cx = Math.max(PAD, Math.min(W - PAD, xOf(Math.max(j0, Math.min(j1, idx)))));
  s += '<line x1="' + cx + '" y1="0" x2="' + cx + '" y2="' + H +
    '" stroke="#3a4051" stroke-width="1"/>';
  // step polyline segments: hold each value until the next change;
  // a non-finite point breaks the line (a gap, never an interpolation)
  let seg = [], segs = [];
  pts.forEach(p => {
    if (Number.isFinite(p.n)) seg.push(p);
    else { if (seg.length) segs.push(seg); seg = []; }
  });
  if (seg.length) segs.push(seg);
  segs.forEach(sg => {
    let past = "", future = "";
    for (let k = 0; k < sg.length; k++) {
      const x = xOf(sg[k].j), y = yOf(sg[k].n);
      const nxt = k + 1 < sg.length ? xOf(sg[k + 1].j) : null;
      const piece = (k ? "" : "M" + x + " " + y) +
        (nxt !== null ? "H" + nxt + "V" + yOf(sg[k + 1].n) : "");
      if (sg[k].j <= idx) past += piece; else future += piece;
      // the step crossing the cursor belongs to the past up to it
    }
    if (past) s += '<path d="' + past +
      '" fill="none" stroke="var(--accent)" stroke-width="1.6"/>';
    if (future) s += '<path d="' + future +
      '" fill="none" stroke="var(--accent)" stroke-width="1.6" opacity="0.3"/>';
  });
  // change points: click = jump to that moment
  let gaps = 0;
  pts.forEach(p => {
    const x = xOf(p.j), dim = p.j > idx ? ' opacity="0.35"' : "";
    if (Number.isFinite(p.n)) {
      s += '<circle class="cpoint" data-goto="' + p.j + '" cx="' + x +
        '" cy="' + yOf(p.n) + '" r="' + (p.j === idx ? 4 : 2.6) + '"' +
        dim + '><title>' + escapeHtml(String(p.n)) + " — event " +
        (p.j + 1) + "</title></circle>";
    } else if (Number.isNaN(p.n)) {
      s += '<rect class="cpoint cnan" data-goto="' + p.j + '" x="' +
        (x - 3) + '" y="' + (H / 2 - 3) + '" width="6" height="6"' + dim +
        '><title>NaN — event ' + (p.j + 1) + "</title></rect>";
    } else if (p.n === Infinity || p.n === -Infinity) {
      const ey = p.n > 0 ? PAD : H - PAD;
      s += '<rect class="cpoint cinf" data-goto="' + p.j + '" x="' +
        (x - 3) + '" y="' + (ey - 3) + '" width="6" height="6"' + dim +
        '><title>' + (p.n > 0 ? "+∞" : "−∞") + " — event " + (p.j + 1) +
        "</title></rect>";
    } else { gaps++;
      s += '<text class="cpoint cgap" data-goto="' + p.j + '" x="' + x +
        '" y="' + (H / 2 + 3) + '" text-anchor="middle"' + dim +
        '><title>non-numeric here — event ' + (p.j + 1) + "</title>×</text>";
    }
  });
  s += "</svg>";
  const fmt = v => { const a = Math.abs(v);
    return (a !== 0 && (a >= 1e6 || a < 1e-4)) ? v.toExponential(2) : String(v); };
  let cap = '<div class="chartcap">' +
    (useLog ? "log₁₀ " : "") + "y: " +
    fmt(useLog ? Math.pow(10, lo) : lo) + " … " +
    fmt(useLog ? Math.pow(10, hi) : hi) +
    " · " + pts.length + " changes";
  if (gaps) cap += " · " + gaps + " non-numeric gap" + (gaps > 1 ? "s" : "");
  if (cut) cap += " · first " + cut + " changes not drawn (cap " +
    CHART_CAP + ")";
  if (wantLog && !logOK) cap += " · log needs all values > 0";
  return '<div class="chartbox">' + s + cap + "</div></div>";
}

/* phase portrait: this variable (x) against a partner (y), one sample
   per change of EITHER, each variable holding its value between its own
   changes. Time is drawn as opacity — the trajectory fades toward the
   past; the bright dot is where the replay stands. */
function renderPhase(label, fid, partner, cutA, ptsA) {
  const { cut: cutB, pts: ptsB } = chartSeries(partner, fid);
  const evsAll = [...new Set(
    [...ptsA.map(p => p.j), ...ptsB.map(p => p.j)])].sort((a, b) => a - b);
  let ai = -1, bi = -1, samples = [], skipped = 0;
  evsAll.forEach(j => {
    while (ai + 1 < ptsA.length && ptsA[ai + 1].j <= j) ai++;
    while (bi + 1 < ptsB.length && ptsB[bi + 1].j <= j) bi++;
    const a = ai >= 0 ? ptsA[ai].n : null, b = bi >= 0 ? ptsB[bi].n : null;
    if (Number.isFinite(a) && Number.isFinite(b))
      samples.push({ j, a, b });
    else if (a !== null || b !== null) skipped++;
  });
  if (samples.length < 2)
    return '<div class="chartbox"><div class="empty">phase portrait ' +
      "needs both variables numeric at overlapping moments (" +
      samples.length + " usable sample" +
      (samples.length === 1 ? "" : "s") + ")</div></div>";
  const W = 460, H = 150, PAD = 10;
  let alo = Infinity, ahi = -Infinity, blo = Infinity, bhi = -Infinity;
  samples.forEach(sm => {
    alo = Math.min(alo, sm.a); ahi = Math.max(ahi, sm.a);
    blo = Math.min(blo, sm.b); bhi = Math.max(bhi, sm.b);
  });
  if (ahi === alo) { ahi += 1; alo -= 1; }
  if (bhi === blo) { bhi += 1; blo -= 1; }
  const xOf = v => PAD + (v - alo) / (ahi - alo) * (W - 2 * PAD);
  const yOf = v => H - PAD - (v - blo) / (bhi - blo) * (H - 2 * PAD);
  let s = svgOpen(H);
  let cur = -1;
  samples.forEach((sm, k) => { if (sm.j <= idx) cur = k; });
  for (let k = 1; k < samples.length; k++) {
    const p = samples[k - 1], q = samples[k];
    const op = k <= cur
      ? (0.2 + 0.8 * (k / Math.max(1, cur)))   // fade into the past
      : 0.12;                                   // the unplayed future
    s += '<line x1="' + xOf(p.a) + '" y1="' + yOf(p.b) + '" x2="' +
      xOf(q.a) + '" y2="' + yOf(q.b) +
      '" stroke="var(--accent)" stroke-width="1.4" opacity="' +
      op.toFixed(3) + '"/>';
  }
  samples.forEach((sm, k) => {
    s += '<circle class="cpoint" data-goto="' + sm.j + '" cx="' +
      xOf(sm.a) + '" cy="' + yOf(sm.b) + '" r="' +
      (k === cur ? 4.5 : 2) + '" opacity="' +
      (k === cur ? 1 : k < cur ? 0.55 : 0.18) + '"><title>(' +
      escapeHtml(String(sm.a)) + ", " + escapeHtml(String(sm.b)) +
      ") — event " + (sm.j + 1) + "</title></circle>";
  });
  s += "</svg>";
  let cap = '<div class="chartcap">x: ' + escapeHtml(label) +
    " · y: " + escapeHtml(partner) + " · " + samples.length + " samples";
  if (skipped) cap += " · " + skipped + " skipped (non-numeric)";
  if (cutA || cutB) cap += " · oldest changes beyond the " + CHART_CAP +
    "-point cap not drawn";
  return '<div class="chartbox">' + s + cap + "</div></div>";
}

/* Sets have no positions: diff by MEMBERSHIP. Only elements that were
   not in the set before get marked — never elements that merely moved. */
function renderSet(enc, old) {
  const oldSigs = old !== undefined && old.t === "set"
    ? new Set(old.v.map(sig)) : null;
  // membership diffing is only sound against a COMPLETE old sample
  const oldComplete = old !== undefined && old.t === "set" &&
    old.n <= old.v.length;
  let cells = enc.v.map((item, i) => {
    let ch = "";
    if (old !== undefined) {
      if (enc.na !== undefined) ch = i < enc.na ? " changed" : "";
      else if (oldComplete) {
        ch = oldSigs.has(sig(item)) ? "" : " changed";
      }
      // partial old sample without na: unknown, leave unmarked
    }
    return '<span class="cell' + ch + '"' + titleAttr(item) + ">" +
      renderValue(item) + "</span>";
  }).join("");
  if (enc.n > enc.v.length)
    cells += '<span class="cell more">+' + (enc.n - enc.v.length) +
      "</span>";
  return '<span class="cont set"' + titleAttr(enc) + ">" + cells + "</span>";
}

/* ---------- variable life index ----------
   One pass assigns every event a FRAME IDENTITY (so recursion doesn't
   mix invocations) and records, per frame+variable, every event where
   it changed. Powers the ‹ prev / next › jumps and the life strip. */
const eventFrame = new Array(events.length);
/* caller of the CURRENT slice, per event — a resumed generator frame
   keeps one fid but may be driven by different callers on different
   slices, so a single fid->parent map would lie to step-out */
const eventParent = new Array(events.length);
const changeIndex = new Map();   // "fid|name" -> [event indices]

/* An asyncio task is a PSEUDO-THREAD (#14): every event carries its
   thread (t) and, when a task drove it, the task name (tk). A lane is
   the pair — each lane gets its own call stack, so interleaving tasks
   replay as alternating stacks instead of one tangled timeline. */
const laneOf = ev => (ev.t || "main") + (ev.tk ? " · " + ev.tk : "");

(function () {
  // null prototypes: lane names come from USER thread/task names — a
  // thread named "constructor" must not collide with Object.prototype
  const stacks = Object.create(null);
  const genFid = Object.create(null); // gen instance -> ONE frame id
  let nextFid = 0;
  events.forEach((ev, i) => {
    const t = laneOf(ev);
    const st = stacks[t] || (stacks[t] = []);
    if (ev.e === "call") {
      let fid;
      if (ev.g && ev.g.s === "r" && genFid[ev.g.i] !== undefined) {
        fid = genFid[ev.g.i];   // a RESUME re-enters the sleeping frame
      } else {
        fid = ++nextFid;
        if (ev.g) genFid[ev.g.i] = fid;
      }
      eventParent[i] = st.length ? st[st.length - 1] : 0;
      st.push(fid);
      eventFrame[i] = fid;
    } else {
      eventFrame[i] = st.length ? st[st.length - 1] : 0;
      eventParent[i] = st.length > 1 ? st[st.length - 2] : 0;
      if (ev.e === "return") st.pop();
    }
    // a RESUME re-emits the frame's whole live state — that is fresh
    // info, not a change, so it must not enter the change index (the
    // ‹ › jumps, ordinals and life strip would stop at non-changes)
    if (ev.ch && !(ev.e === "call" && ev.g && ev.g.s === "r")) {
      const fid = eventFrame[i];
      for (const k of Object.keys(ev.ch)) {
        const key = fid + "|" + k;
        let arr = changeIndex.get(key);
        if (!arr) changeIndex.set(key, arr = []);
        arr.push(i);
      }
    }
  });
})();

function changesFor(label, fid) {
  // promoted attr rows (self.adj_list) navigate on their parent object;
  // #72 watch keys carry arbitrary expression text — never split them
  const base = label.startsWith("watch:") ? label : label.split(".")[0];
  return changeIndex.get(fid + "|" + base) || [];
}

/* fn-granularity traces carry µs timestamps (delta-encoded): rebuild
   absolute times once, and each frame's birth time, so return events
   can show real durations. Line traces have no ts — times under line
   tracing would be fiction, so none are shown. */
let absTs = null;

const frameActive = {};   // fid -> total active µs (all slices summed)
const frameSlices = {};   // fid -> slice count (1 = plain frame)
if (DATA.granularity === "fn") {
  absTs = new Array(events.length);
  const curBirth = {};
  let acc = 0;
  events.forEach((e, i) => {
    acc += e.ts || 0;
    absTs[i] = acc;
    const fid = eventFrame[i];
    if (e.e === "call") {
      curBirth[fid] = acc;   // per slice: a resume starts a NEW slice
      frameSlices[fid] = (frameSlices[fid] || 0) + 1;
    }
    sliceBirth[i] = curBirth[fid];

}

/* ---------- state reconstruction: replay events 0..idx ----------
   One call stack per thread; the panel shows the stack of the thread
   the current event belongs to. */
let stateCache = null;   // { lastIdx, stacks, curT } — makes stepping O(1)

/* keyframes (#101): every KF_EVERY events of a from-scratch walk, the
   whole per-lane stack state is snapshotted (shallow frame + vars
   copies — encodings are immutable, so sharing them is safe). A later
   jump resumes from the nearest keyframe below the target instead of
   replaying the run from event 0: seeks in a 2M-event trace replay at
   most KF_EVERY events. Built lazily — the first deep jump pays the
   full walk once and leaves the keyframes behind. */

}
function maybeKeyframe(i, idx, stacks, curT) {
  if (i < idx && (i + 1) % KF_EVERY === 0 && !kfStore.has(i)) {
    kfStore.set(i, { stacks: cloneStacks(stacks), curT });
    kfIndices.push(i);
    kfIndices.sort((a, b) => a - b);

}
function computeStacks(idx) {

  if (stateCache && idx === stateCache.lastIdx + 1) {
    // incremental: apply only the new event (playback stays fast at any
    // trace size); first do the pop deferred from the previous event
    stacks = stateCache.stacks;
    curT = stateCache.curT;
    const prev = events[stateCache.lastIdx];
    if (prev && prev.e === "return") {
      const pt = laneOf(prev);
      (stacks[pt] || []).pop();
    }
    start = idx;
  } else {
    // backward step or jump: rebuild — from the nearest keyframe when
    // one exists, else from the beginning (null proto — lane names are
    // user thread/task names, "constructor" included)
    stacks = Object.create(null);
    curT = "main";
    start = 0;
    for (let q = kfIndices.length - 1; q >= 0; q--) {
      if (kfIndices[q] < idx) {
        const kf = kfStore.get(kfIndices[q]);
        stacks = cloneStacks(kf.stacks);
        curT = kf.curT;
        start = kfIndices[q] + 1;
        break;
      }
    }
  }
  for (let i = start; i <= idx; i++) {
    const ev = events[i];
    if (ev.e === "chap" || ev.e === "hb" || ev.e === "viol") {
      maybeKeyframe(i, idx, stacks, curT);   // boundaries, wakes and
      continue;                              // verdicts are not frames
    }
    const t = laneOf(ev);
    curT = t;
    const stack = stacks[t] || (stacks[t] = []);
    if (ev.e === "call") {
      stack.push({ fn: ev.fn, f: ev.f, l: ev.l,
                   vars: Object.assign({}, ev.ch),
                   changed: Object.keys(ev.ch), prevVals: {},
                   cl: ev.cl || null, da: ev.da || null,
                   mut: ev.mut || [], ali: ev.ali || null,
                   ret: undefined });
    } else if (stack.length) {
      const top = stack[stack.length - 1];
      top.l = ev.l;
      top.prevVals = {};   // value-before-this-event, for element diffing
      for (const k of Object.keys(ev.ch)) top.prevVals[k] = top.vars[k];
      Object.assign(top.vars, ev.ch);
      top.changed = Object.keys(ev.ch);
      top.mut = ev.mut || [];
      top.ali = ev.ali || null;
      if (ev.e === "return") top.ret = ev.ret;
    }
    // pop returned frames, except when the return IS the current event,
    // so its frame stays visible with the return value shown
    if (ev.e === "return" && i < idx) stack.pop();
    maybeKeyframe(i, idx, stacks, curT);
  }
  stateCache = { lastIdx: idx, stacks, curT };
  return { stack: stacks[curT] || [], thread: curT };
}

/* ---------- rendering ---------- */
/* machinery badges: user-toggleable DISPLAY of the interpreter's

   glyphs on; the wordier panels (MRO, dunder) off. */
const MACH_KEY = "pyreplay-mach";
const MACH_DEFAULTS = { alias: true, cell: true, def: true, imp: true,
                        mro: false, dun: false, fullobj: false };
let MACH = { ...MACH_DEFAULTS };
try { MACH = { ...MACH_DEFAULTS,
               ...JSON.parse(localStorage.getItem(MACH_KEY) || "{}") }; }
catch (e) {}
document.querySelectorAll("#machmenu input[data-mach]").forEach(cb => {
  cb.checked = !!MACH[cb.dataset.mach];
  cb.onchange = () => {
    MACH[cb.dataset.mach] = cb.checked;
    try { localStorage.setItem(MACH_KEY, JSON.stringify(MACH)); }
    catch (e) {}

let idx = 0;
let highlighted = null;
let collapsed = false;   // variables panel: show only changing vars
let historyVar = null;   // label whose life strip is unfolded
let lastFnq = "?/";      // view-pref qualifier of the last rendered frame

/* #85: the anatomy panel — the innermost enclosing record's AST tree

      || !Object.keys(DATA.anatomy).length) {

      "fn trace records calls, not lines, so there is no current " +
      "line to dissect.</div>";

    anatKey = "fn";
    return;
  }
  const rec = anatRec(ev.f, ev.l);
  if (!rec) {
    body.innerHTML = '<div class="anote">no anatomy for this file ' +
      "(unparseable, or outside the recorded set).</div>";
    $("anatname").textContent = "";
    anatKey = null;

  const key = ev.f + "␀" + rec.q + "␀" + ev.l;
  if (key === anatKey) return;

    "–" + rec.l1 + "</div>";

    astHtml(rec.ast, ev.l) + "</div>";
  h += '<div class="ahead" title="compiled fresh from the source: the ' +

    esc2(py) + " · as compiled, not adaptive</div>";

      const showl = r[3] != null && r[3] !== prev;
      if (r[3] != null) prev = r[3];

        '"><span class="disl">' + (showl ? r[3] : "") + "</span>" +
        '<span class="dist">' + (r[4] ? "»" : "") + "</span>" +
        '<span class="diso">' + r[0] + "</span>" +

function render() {
  const ev = events[idx];
  if (!ev) return;
  const { stack } = computeStacks(idx);
  const top = stack[stack.length - 1];

  activateFile(ev.f);
  if (highlighted) highlighted.classList.remove("current", "excl");
  const pane = panes[ev.f];
  const lineEl = pane && pane.lineEls[ev.l - 1];
  if (lineEl) {
    lineEl.classList.add("current");
    if (ev.e === "exc") lineEl.classList.add("excl");
    highlighted = lineEl;
    const box = $("code");
    const y = lineEl.offsetTop;
    if (y < box.scrollTop + 30 || y > box.scrollTop + box.clientHeight - 50) {
      box.scrollTop = y - box.clientHeight / 2;
    }
  }

  const GK = { g: "generator", c: "coroutine", a: "async generator" };
  /* #88: the wake panel — who woke whom, jumpable to the other end */
  const wk = $("wake");

    // #73: the broken contract, with the values that broke it
    const vals = Object.entries(ev.vals || {}).map(([k, v]) =>
      k + " = " + (v && v.v !== undefined
        ? v.v : "<" + ((v && (v.c || v.t)) || "?") + ">"));

        cls = ev.cond.r ? "true" : "done";
      } else if (k === "case") {
        verdict = ev.cond.r ? "matched" : "no match";
        cls = ev.cond.r ? "true" : "done";
      } else {
        verdict = ev.cond.r ? "True" : "False";
        cls = ev.cond.r ? "true" : "false";
      }
      panel = '<span class="cexpr">' + escapeHtml(ev.cond.x) + "</span>" +
        (vals ? '<div class="cvars">' + vals + "</div>" : "") +
        '<div>→ <span class="cres ' + cls + '">' + verdict +
        "</span></div>";
    } else if (vals) {
      panel = '<div class="cvars">' + vals + "</div>";
    }
  }
  $("cond").innerHTML = panel;

  $("stack").innerHTML = stack.slice().reverse().map((fr, i) =>
    '<div class="' + (i === 0 ? "top" : "") + '"><span class="fn">'
    + escapeHtml(fr.fn) + "</span> — " + escapeHtml(fr.f) + ":" + fr.l
    + "</div>"
  ).join("") || '<div class="empty">(empty)</div>';

  if (top) {
    const changed = new Set(top.changed);
    const fnq = (top.fn || "?") + "/";
    lastFnq = fnq;
    // build display rows; object variables get their attributes
    // PROMOTED to first-class rows (g.adj_list …), each with its own
    // view selector — that's where OOP code keeps its data
    const displayRows = [];
    for (const [k, v] of Object.entries(top.vars)) {
      const isCh = changed.has(k);
      const old = isCh && top.prevVals ? top.prevVals[k] : undefined;
      if (v && v.t === "obj") {
        displayRows.push({ label: k, isCh,
          enc: { t: "o", c: v.c, v: "<" + (v.c || "object") + " instance>" },
          old: undefined });
        const oldMap = {};
        if (old !== undefined && old.t === "obj")
          old.v.forEach(p => { oldMap[p[0]] = p[1]; });
        // "cha" = tracer-stamped names of the attrs that ACTUALLY changed.
        // On CALL events it is authoritative, even when EMPTY (a method-
        // entry re-emission of an object seen before: nothing moved, so
        // no attr row flags). On LINE events it only SUPPLEMENTS the sig
        // comparison (it lists deep changes; shallow ones are caught by
        // sig). Absent cha (old traces, first observation) falls back to
        // sig; frame birth then shows all attrs as new — honestly, since
        // nothing was ever observed before.
        const hasCha = Array.isArray(v.cha) && ev.e === "call";
        const chaSet = new Set(v.cha || []);
        v.v.forEach(([ak, av]) => {
          const aOld = oldMap[ak];
          const aCh = isCh && (hasCha
            ? chaSet.has(ak)
            : (old === undefined || old.t !== "obj" ||
               aOld === undefined || sig(aOld) !== sig(av)));
          displayRows.push({ label: k + "." + ak, enc: av,
                             old: aCh ? aOld : undefined, isCh: aCh });
        });
      } else {
        displayRows.push({ label: k, enc: v, old, isCh });
      }
    }
    // collapse mode: keep changing rows and "pinned" rows (a chosen
    // view = you're watching it). Ineligible shapes degrade to cells —
    // better one plain row than silently hiding a watched variable.
    let visibleRows = displayRows;
    if (collapsed)
      visibleRows = displayRows.filter(r =>
        r.isCh || getViewPref(fnq + r.label) !== "cells");
    // lookup for overlay data: any row (incl. promoted attrs) by label
    const rowByLabel = {};
    displayRows.forEach(r => { rowByLabel[r.label] = r; });
    const ovCandidates = displayRows
      .filter(r => r.enc && ["set", "dict", "list", "tuple"].includes(r.enc.t))
      .map(r => r.label);
    const chartCandidates = displayRows
      .filter(r => numericScalar(r.enc)).map(r => r.label);
    // a RESUME re-emits the frame's whole live state against an empty
    // snapshot: "changed" there means "fresh info", not a change — no
    // changed highlight, no ↦ rebound glyph (unknown = unmarked)
    const resumed = ev.e === "call" && ev.g && ev.g.s === "r";
    const rows = visibleRows.map(r => {
      const opts = viewOptions(r.enc);
      // pref keyed by function/variable: same-named vars in different
      // functions keep independent view choices
      const prefKey = fnq + r.label;
      let view = getViewPref(prefKey);
      if (!opts.includes(view)) view = "cells";
      // overlay: color the graph by another variable (user-chosen)
      let ov = null, ovsel = "", chartVs = "";
      if (view === "graph" || view === "edges") {
        const ovName = getPref(prefKey + ":overlay", "");
        const ovRow = ovName && rowByLabel[ovName];
        if (ovRow) ov = { enc: ovRow.enc, old: ovRow.old };
        const cands = ovCandidates.filter(c => c !== r.label);
        if (cands.length)
          ovsel = '<select class="ovsel" data-key="' +
            escapeHtml(prefKey + ":overlay") +
            '"><option value="">no overlay</option>' +
            cands.map(c => '<option value="' + escapeHtml(c) + '"' +
              (c === ovName ? " selected" : "") + ">tint: " +
              escapeHtml(c) + "</option>").join("") + "</select>";
      }
      if (view === "chart") {
        // partner select (-> phase portrait) + scale select, both riding
        // the existing .ovsel pref delegate — no new handlers
        chartVs = getPref(prefKey + ":chartvs", "");
        if (chartVs && !chartCandidates.includes(chartVs)) chartVs = "";
        const cands = chartCandidates.filter(c => c !== r.label);
        if (cands.length)
          ovsel = '<select class="ovsel" data-key="' +
            escapeHtml(prefKey + ":chartvs") +
            '"><option value="">vs time</option>' +
            cands.map(c => '<option value="' + escapeHtml(c) + '"' +
              (c === chartVs ? " selected" : "") + ">vs " +
              escapeHtml(c) + "</option>").join("") + "</select>";
        if (!chartVs) {
          const lg = getPref(prefKey + ":chartlog", "");
          ovsel += '<select class="ovsel" data-key="' +
            escapeHtml(prefKey + ":chartlog") +
            '"><option value="">linear</option><option value="1"' +
            (lg === "1" ? " selected" : "") + ">log</option></select>";
        }
      }
      let body;
      try {
        body = view === "grid" ? renderGrid(r.enc, r.old)
             : view === "bars" ? renderBars(r.enc, r.old)
             : view === "graph" ? renderGraph(r.enc, r.old, "graph", ov)
             : view === "edges" ? renderGraph(r.enc, r.old, "edges", ov)
             : view === "chart" ? renderChart(r.label, eventFrame[idx],
                 chartVs, getPref(prefKey + ":chartlog", "") === "1")
             : renderValue(r.enc, r.old);
      } catch (err) {
        body = renderValue(r.enc, r.old);   // renderer bug ≠ dead panel
      }
      const sel = opts.length > 1
        ? '<select class="viewsel" data-key="' + escapeHtml(prefKey) + '">' +
          opts.map(o => '<option value="' + o + '"' +
            (o === view ? " selected" : "") + ">" + o + "</option>").join("") +
          "</select>"
        : "";
      // life navigation: ‹ prev-change | ordinal/total | next-change ›
      const fid = eventFrame[idx];
      const chList = changesFor(r.label, fid);
      let ordinal = 0;
      for (const j of chList) { if (j <= idx) ordinal++; else break; }
      const dv = ' data-var="' + escapeHtml(r.label) + '"';
      const base = r.label.split(".")[0];
      const nav = chList.length
        ? '<span class="vnav"><button class="vprev"' + dv +
          ' title="jump to previous change of ' + escapeHtml(base) +
          '">‹</button><span class="vcount"' + dv +
          ' title="changes of ' + escapeHtml(base) +
          ' in this frame — click for its life strip">' + ordinal + "/" +
          chList.length + '</span><button class="vnext"' + dv +
          ' title="jump to next change of ' + escapeHtml(base) +
          '">›</button></span>'
        : "";
      // life strip: every change as a clickable tick on the trace axis
      let strip = "";
      if (historyVar === r.label && chList.length && chList.length <= 1000) {
        const total = Math.max(1, events.length - 1);
        strip = '<div class="vstrip">' + chList.map((j, q) =>
          '<span class="vtick' + (j === idx ? " cur" : "") +
          (q === 0 ? " birth" : "") + '" style="left:' +
          (j / total * 100) + '%" data-goto="' + j + '" title="change ' +
          (q + 1) + "/" + chList.length + " — event " + (j + 1) +
          '"></span>').join("") + "</div>";
      } else if (historyVar === r.label && chList.length > 1000) {
        strip = '<div class="gnote">' + chList.length +
          " changes — too many to draw; use ‹ › to walk them</div>";
      }
      // the interpreter's hidden machinery, as glyphs on the name:
      // ↺ mutated in place (all aliases changed) · ↦ rebound ·
      // 🔗 alias group · ⛓ closure cell · ⚠ shared mutable default
      let gly = "";
      if (MACH.alias && top.mut && top.mut.includes(base))
        gly += '<span class="gly mut" title="object mutated IN PLACE — ' +
          'every name pointing at it changed too">↺</span>';
      else if (MACH.alias && r.isCh && !r.label.includes(".") && !resumed)
        gly += '<span class="gly reb" title="name rebound — it now ' +
          'points at a different object">↦</span>';
      if (MACH.alias && top.ali) {
        const gi = top.ali.findIndex(gr => gr.includes(base));
        if (gi >= 0)
          gly += '<span class="gly ali" style="color:hsl(' +
            ((gi * 137.5 + 190) % 360).toFixed(0) + ' 70% 65%)" ' +
            'title="same object as: ' +
            esc2(top.ali[gi].filter(n => n !== base).join(", ")) +
            '">🔗</span>';
      }
      if (MACH.cell && top.cl) {
        if (top.cl.f && top.cl.f.includes(base))
          gly += '<span class="gly cell" title="closure cell — this ' +
            'variable lives in the ENCLOSING frame">⛓↑</span>';
        else if (top.cl.c && top.cl.c.includes(base))
          gly += '<span class="gly cell" title="closure cell — shared ' +
            'with inner functions defined here">⛓↓</span>';
      }
      if (MACH.def && top.da && top.da.includes(base))
        gly += '<span class="gly def" title="⚠ this argument IS the ' +
          'function’s shared mutable default — it persists ' +
          'across calls">⚠def</span>';
      // tripwire: the poison is born at THIS event; glyph only the rows
      // whose displayed value actually carries it (an object trip lands
      // on the poisoned attribute rows, not every attribute)
      if (ev.trip && ev.trip.some(t => t.v === base)) {
        const pk = poisonIn(r.enc);
        if (pk)
          gly += '<span class="gly trip" title="☢ became ' +
            (pk === "nan" ? "NaN" : "Infinity") + ' at THIS event — ' +
            'the birth of the poison; downstream values inherit it, ' +
            'the crash comes later">☢</span>';
      }
      // provenance: what produced this variable's new value — each source
      // operand from the static data-flow, linked to where IT was last set
      // (the change index). Static names + dynamic "when" = "why this value".
      let prov = "";
      if (r.isCh && !r.label.includes(".") && !resumed) {
        // settrace reports a change on the line AFTER the statement that
        // caused it, so the assignment's data-flow lives on the previous
        // executed line IN THIS FRAME — walk back to it.
        let pj = idx - 1;
        while (pj >= 0 && eventFrame[pj] !== eventFrame[idx]) pj--;
        const srcs = pj >= 0
          ? (((DATA.dataflow || {})[events[pj].f] || {})[events[pj].l]
             || {})[r.label]
          : null;
        if (srcs && srcs.length) {
          const links = srcs.map(s => {
            const cl = changesFor(s, eventFrame[idx]);
            let last = -1;
            for (const j of cl) { if (j < idx) last = j; else break; }
            return last >= 0
              ? '<button class="provlink" data-goto="' + last +
                '" title="' + escapeHtml(s) + ' was last set at event ' +
                (last + 1) + ' — click to jump">' + escapeHtml(s) + "</button>"
              : '<span class="provarg" title="' + escapeHtml(s) +
                ' — a parameter, literal input, or set before this frame">' +
                escapeHtml(s) + "</span>";
          });
          prov = '<div class="prov" title="what produced ' +
            escapeHtml(r.label) + '">← from ' + links.join(", ") +
            ' <button class="provslice" data-slice="' +
            escapeHtml(r.label) + '" title="#75 backward slice: every ' +
            'recorded event that contributed to this value — pins the ' +
            'scrubber, ←/→ walk the chain">✂ slice</button></div>';
        }
      }
      return '<div class="vrow' + (r.isCh && !resumed ? " changed" : "") +
        '"><div class="vname">' + escapeHtml(r.label) + gly + sel +
        ovsel + nav + "</div>" + prov + strip +
        '<div class="vval">' + body + "</div></div>";
    });
    $("vars").innerHTML = rows.length
      ? rows.join("")
      : '<div class="empty">' + (collapsed
          ? "(nothing changes at this event)"
          : "(no variables yet)") + "</div>";
  } else {
    $("vars").innerHTML = '<div class="empty">(no frame)</div>';
  }

  renderConsole();
  updateAnatomy();
  $("counter").textContent = (idx + 1) + " / " + events.length;
  $("scrub").value = idx;
  updateHash();
}

/* ---------- transport controls ---------- */
function goto(i) {
  idx = Math.max(0, Math.min(events.length - 1, i));
  render();
}
let timer = null;
function stop() {
  if (timer) { clearInterval(timer); timer = null; }
  $("btn-play").textContent = "▶ Play";
}
function play() {
  if (timer) { stop(); return; }
  if (!events.length) return;
  if (idx >= events.length - 1) idx = 0;
  $("btn-play").textContent = "⏸ Pause";
  timer = setInterval(() => {
    if (idx >= events.length - 1) { stop(); return; }
    goto(idx + 1);
  }, parseInt($("speed").value, 10));
}
/* blur after click so Space/arrows drive the replay, never a focused button */
function ctl(id, fn) {
  $(id).onclick = e => { fn(); e.currentTarget.blur(); };
}
/* step-over: next event in THIS frame (skips everything nested);
   if the frame never runs again (we're at its return), plain step.
   step-out: next event in the CALLER's frame. Both O(distance) scans
   over the precomputed frame ids. */
function stepOver() {
  const fid = eventFrame[idx];
  for (let j = idx + 1; j < events.length; j++)
    if (eventFrame[j] === fid) { goto(j); return; }
  goto(idx + 1);
}
function stepOut() {
  const par = eventParent[idx];   // caller of the CURRENT slice
  if (!par) return;   // module frame or task root: no caller
  for (let j = idx + 1; j < events.length; j++)
    if (eventFrame[j] === par) { goto(j); return; }
}
ctl("btn-first", () => { stop(); goto(0); });
ctl("btn-prev",  () => { stop(); sliceStep(-1); });   // #75: walks the
ctl("btn-next",  () => { stop(); sliceStep(1); });    // slice when on
ctl("btn-over",  () => { stop(); stepOver(); });
ctl("btn-out",   () => { stop(); stepOut(); });
ctl("btn-last",  () => { stop(); goto(events.length - 1); });
ctl("btn-play",  play);

/* bookmarks: B toggles at the current event, persisted per trace;
   cyan marks above the scrubber, [ and ] jump between them */
const BM_KEY = "pyreplay-bm:" + DATA.script + ":" + events.length;
let bookmarks = [];
try { bookmarks = JSON.parse(localStorage.getItem(BM_KEY) || "[]"); }
catch (e) {}
function toggleBookmark() {
  const p = bookmarks.indexOf(idx);
  if (p >= 0) bookmarks.splice(p, 1);
  else { bookmarks.push(idx); bookmarks.sort((a, b) => a - b); }
  try { localStorage.setItem(BM_KEY, JSON.stringify(bookmarks)); }
  catch (e) {}
  renderBmarks();
}
function renderBmarks() {
  let box = document.getElementById("bmarks");
  if (!box) {
    box = document.createElement("div");
    box.id = "bmarks";
    const footer = document.querySelector("footer");
    footer.insertBefore(box, footer.firstChild);
  }
  const total = Math.max(1, events.length - 1);
  box.innerHTML = "";
  bookmarks.forEach(j => {
    const m = document.createElement("span");
    m.className = "bmark";
    m.style.left = (j / total * 100) + "%";
    m.title = "bookmark — event " + (j + 1) + " (B removes)";
    m.onclick = () => { stop(); goto(j); };
    box.appendChild(m);
  });
  box.style.display = bookmarks.length ? "" : "none";
}
function jumpBookmark(dir) {
  if (!bookmarks.length) return;
  if (dir > 0) {
    const t = bookmarks.find(j => j > idx);
    if (t !== undefined) { stop(); goto(t); }
  } else {
    const arr = bookmarks.filter(j => j < idx);
    if (arr.length) { stop(); goto(arr[arr.length - 1]); }
  }
}
renderBmarks();

/* density strip: the trace's shape before you scrub it — colored by
   which FILE each region of the run lived in (hue per file) */
(function () {
  if (events.length < 50) return;
  const files = Object.keys(DATA.sources);
  if (!files.length) return;
  const fileHue = {};
  files.forEach((f, i) => { fileHue[f] = (i * 137.5) % 360; });
  const BUCKETS = Math.min(240, events.length);
  const per = events.length / BUCKETS;
  const box = document.createElement("div");
  box.id = "density";
  for (let b = 0; b < BUCKETS; b++) {
    const lo = Math.floor(b * per);
    const hi = Math.min(events.length, Math.floor((b + 1) * per));
    const byFile = {};
    for (let i = lo; i < hi; i++) {
      const f = events[i].f;
      byFile[f] = (byFile[f] || 0) + 1;
    }
    let top = null, n = 0;
    for (const f in byFile)
      if (byFile[f] > n) { n = byFile[f]; top = f; }
    const s = document.createElement("span");
    s.className = "dbucket";
    if (top !== null) {
      s.style.background =
        "hsl(" + fileHue[top].toFixed(0) + " 55% 45% / .85)";
      s.title = top + " (events " + (lo + 1) + "–" + hi +
        " — click to jump)";
    }
    s.onclick = () => { stop(); goto(lo); };
    box.appendChild(s);
  }
  const footer = document.querySelector("footer");
  footer.insertBefore(box, footer.firstChild);
})();

let stackVisible = true;

function toggleCollapse() {

  setStack(!collapsed);   // collapse mode hides the stack too

}

/* draggable divider between code pane and sidebar */
(() => {
  const divider = $("divider"), side = $("side");
  let dragging = false;
  divider.onmousedown = e => {
    dragging = true;
    divider.classList.add("dragging");
    e.preventDefault();
  };
  document.addEventListener("mousemove", e => {
    if (!dragging) return;
    const w = Math.min(Math.max(window.innerWidth - e.clientX, 220),
                       window.innerWidth - 260);
    side.style.width = w + "px";
  });
  document.addEventListener("mouseup", () => {
    dragging = false;
    divider.classList.remove("dragging");
  });
  divider.ondblclick = () => { side.style.width = "340px"; };
})();
$("speed").onchange    = e => {

$("scrub").max = Math.max(0, events.length - 1);
/* crash markers: every hard exception, clickable, above the scrubber */
(function () {

/* test chapters (#98): one colored span per test above the scrubber —

(function () {

/* #89: gold pins — the critical path, walkable on the scrubber */

/* trip markers: every NaN/Inf birth, amber; the first one glows.
   #73 invariant violations share the strip (and open it). */
(function () {
  if (!DATA.trip && !DATA.invariants) return;
  const box = document.createElement("div");
  box.id = "tripmarks";
  const total = Math.max(1, events.length - 1);
  let first = true;
  events.forEach((e, i) => {
    // #73: invariant violations share the amber strip — both marks
    // mean "a stated rule about values broke right here"
    if (e.e === "viol") {
      const m = document.createElement("span");
      m.className = "tmark";
      m.style.left = (i / total * 100) + "%";
      m.title = "⚖ invariant [" + e.inv + "] violated — " + e.f + ":" +
        e.l + " (event " + (i + 1) + ")";

      box.appendChild(m);
      return;

    if (!e.trip) return;
    const m = document.createElement("span");
    m.className = "tmark" + (first ? " tfirst" : "");
    first = false;
    m.style.left = (i / total * 100) + "%";
    m.title = "☢ " + e.trip.map(t =>
      (t.v === "<return>" ? "return value" : t.v) + " → " +
      (t.k === "nan" ? "NaN" : "Inf")).join(", ") +
      " — " + e.f + ":" + e.l + " (event " + (i + 1) + ")";
    m.onclick = () => { stop(); goto(i); };
    box.appendChild(m);
  });
  if (box.children.length) {
    const footer = document.querySelector("footer");
    footer.insertBefore(box, footer.firstChild);
  }
})();
$("scrub").oninput = e => { stop(); goto(parseInt(e.target.value, 10)); };
$("scrub").onchange = e => e.target.blur();   // drag ended: release focus
/* view selector: delegated, since #vars is rebuilt on every render */
$("vars").onchange = e => {
  const sel = e.target;
  if (!sel.classList || !(sel.classList.contains("viewsel") ||
                          sel.classList.contains("ovsel"))) return;
  setViewPref(sel.dataset.key, sel.value);
  sel.blur();
  render();
};
/* playback rebuilds #vars every tick, which would close an open
   dropdown mid-interaction — pause when the user grabs a selector */
$("vars").addEventListener("mousedown", e => {
  if (e.target.classList && (e.target.classList.contains("viewsel") ||
                             e.target.classList.contains("ovsel"))) stop();
});
/* life navigation: delegated (rows are rebuilt every render) */
$("vars").addEventListener("click", e => {
  const t = e.target;
  if (!t.classList) return;
  if (t.classList.contains("vprev") || t.classList.contains("vnext")) {
    const list = changesFor(t.dataset.var, eventFrame[idx]);
    let target = null;
    if (t.classList.contains("vprev")) {
      for (let k = list.length - 1; k >= 0; k--)
        if (list[k] < idx) { target = list[k]; break; }
    } else {
      for (let k = 0; k < list.length; k++)
        if (list[k] > idx) { target = list[k]; break; }
    }
    if (target !== null) { stop(); goto(target); }
  } else if (t.classList.contains("vcount")) {
    historyVar = historyVar === t.dataset.var ? null : t.dataset.var;
    render();
  } else if (t.classList.contains("provslice")) {
    stop();
    enterSlice(t.dataset.slice);   // #75
  } else if (t.classList.contains("vtick")
             || t.classList.contains("provlink")
             || t.classList.contains("cpoint")) {
    stop();
    goto(parseInt(t.dataset.goto, 10));
  }
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") {
    if (e.key === "Escape") e.target.blur();   // recover the transport
    return;
  }
  if (e.key === "ArrowRight") { stop(); sliceStep(1); }
  else if (e.key === "ArrowLeft") { stop(); sliceStep(-1); }
  else if (e.key === "Escape") { if (SLICE) exitSlice(); }
  else if (e.key === "Home") { stop(); goto(0); }
  else if (e.key === "End") { stop(); goto(events.length - 1); }
  else if (e.key === " ") { e.preventDefault(); play(); }
  else if (e.key === "c" || e.key === "C") toggleCollapse();
  else if (e.key === "o" || e.key === "O") { stop(); stepOver(); }
  else if (e.key === "u" || e.key === "U") { stop(); stepOut(); }
  else if (e.key === "b" || e.key === "B") toggleBookmark();
  else if (e.key === "[") jumpBookmark(-1);
  else if (e.key === "]") jumpBookmark(1);
  else if (e.key === "/") { e.preventDefault(); $("query").focus(); }
});

/* the query bar (#109): search over EVENTS, not text. A tiny fixed
   grammar — never eval of user code — where every space-separated
   token must match (AND):
     type:line|call|return|exc|chap|yield|resume   event kind
     exc:Name        exception type contains Name
     fn:txt file:txt substring of function / file
     line:N          exact source line
     after:N before:N  1-based event-index bounds
     changed:VAR     VAR changed at this event
     mut:VAR         VAR mutated in place here
     task:txt thread:txt   lane filters
     trip            a NaN/Inf birth (--trip)
     VAR=val VAR>n VAR<n VAR>=n VAR<=n   the CHANGED value (= compares
       the shown primitive text; <,> compare numerically)
     anything else   substring of that event's SOURCE LINE
   Honesty: value tests see the moments a variable CHANGED — the
   recorded facts — not interpolated state between changes. */
let qHits = [];
function srcLineAt(ev) {
  if (!ev.f || !ev.l) return "";
  const text = DATA.sources[ev.f];
  if (!text) return "";
  const ls = text.split("\n");
  return (0 < ev.l && ev.l <= ls.length) ? ls[ev.l - 1] : "";
}
function parseQuery(q) {
  const preds = [], bad = [];
  q.trim().split(/\s+/).filter(Boolean).forEach(tok => {
    let m;
    if ((m = tok.match(/^type:(\w+)$/i))) {
      const k = { exception: "exc", exc: "exc", line: "line",
                  call: "call", return: "return", ret: "return",
                  chap: "chap", test: "chap", log: "log",
                  console: "log", hb: "hb", wake: "hb", viol: "viol",
                  invariant: "viol", yield: "yield",
                  resume: "resume" }[m[1].toLowerCase()];
      if (!k) { bad.push(tok); return; }
      if (k === "yield")
        preds.push(e => e.e === "return" && e.g && e.g.s === "y");
      else if (k === "resume")
        preds.push(e => e.e === "call" && e.g && e.g.s === "r");
      else preds.push(e => e.e === k);
    } else if ((m = tok.match(/^exc:(.+)$/)))
      preds.push(e => e.e === "exc" && e.x &&
        String(e.x.t || "").includes(m[1]));
    else if ((m = tok.match(/^fn:(.+)$/)))
      preds.push(e => (e.fn || "").includes(m[1]));
    else if ((m = tok.match(/^file:(.+)$/)))
      preds.push(e => (e.f || "").includes(m[1]));
    else if ((m = tok.match(/^line:(\d+)$/)))
      preds.push(e => e.l === parseInt(m[1], 10));
    else if ((m = tok.match(/^after:(\d+)$/))) {
      const n = parseInt(m[1], 10);
      preds.push((e, i) => i + 1 > n);
    } else if ((m = tok.match(/^before:(\d+)$/))) {
      const n = parseInt(m[1], 10);
      preds.push((e, i) => i + 1 < n);
    } else if ((m = tok.match(/^changed:(.+)$/)))
      preds.push(e => e.ch && Object.prototype.hasOwnProperty.call(
        e.ch, m[1]));
    else if ((m = tok.match(/^mut:(.+)$/)))
      preds.push(e => (e.mut || []).includes(m[1]));
    else if ((m = tok.match(/^task:(.+)$/)))
      preds.push(e => (e.tk || "").includes(m[1]));
    else if ((m = tok.match(/^thread:(.+)$/)))
      preds.push(e => (e.t || "").includes(m[1]));
    else if (tok === "trip")
      preds.push(e => !!e.trip);
    else if ((m = tok.match(/^([A-Za-z_][\w.]*)(==|>=|<=|=|>|<)(.+)$/))) {
      const name = m[1], op = m[2], valS = m[3];
      preds.push(e => {
        if (!e.ch || !Object.prototype.hasOwnProperty.call(e.ch, name))
          return false;
        const enc = e.ch[name];
        if (!enc || (enc.t !== "p" && enc.t !== "s")) return false;
        if (op === "=" || op === "==") return String(enc.v) === valS;
        const a = parseNum(String(enc.v)), b = parseNum(valS);
        if (Number.isNaN(a) || Number.isNaN(b)) return false;
        return op === ">" ? a > b : op === "<" ? a < b
             : op === ">=" ? a >= b : a <= b;
      });
    } else if (/^[A-Za-z_]\w*:\S/.test(tok)) {
      bad.push(tok);   // looks like a typo'd operator — say so, never
    }                  // silently downgrade it to a 0-hit text search
    else preds.push(e => srcLineAt(e).includes(tok));
  });
  return { preds, bad };
}
function ensureQmarks() {
  let box = document.getElementById("qmarks");
  if (!box) {
    box = document.createElement("div");
    box.id = "qmarks";
    const bar = document.getElementById("qbar");
    bar.parentNode.insertBefore(box, bar);
  }
  return box;
}
/* ---------- #75 backward slice: transitive provenance ----------
   The provenance panel answers one hop ("← from a, b"); the slice
   iterates it to closure: every recorded event that contributed to
   the clicked value. Name-flow only, and it says so — attribute/
   subscript writes, in-place mutation, C-level effects and caller
   arguments are FRONTIER stops, listed, never silently crossed. */
let SLICE = null;
const SLICE_CAP = 400;

function lastChangeBefore(name, fid, at, inclusive) {
  const cl = changesFor(name, fid);
  let last = -1;
  for (const j of cl) {
    if (j < at || (inclusive && j === at)) last = j;
    else break;
  }
  return last;
}

function computeSlice(label, at) {
  const evs = new Set(), frontier = [], seen = new Set();
  let truncated = false;
  const fid0 = eventFrame[at];
  const seed = lastChangeBefore(label, fid0, at, true);
  const queue = [];
  if (seed >= 0) queue.push({ n: label, at: seed, fid: fid0 });
  else frontier.push({ n: label, at: -1,
                       why: "no recorded change in this frame" });
  while (queue.length) {
    if (evs.size >= SLICE_CAP) { truncated = true; break; }
    const nd = queue.shift();
    const key = nd.fid + "|" + nd.n + "@" + nd.at;
    if (seen.has(key)) continue;
    seen.add(key);
    evs.add(nd.at);
    const ev = events[nd.at];
    if (nd.n !== "<return>" && ev.e === "call") {
      // a parameter arrives AT the call: the chain continues in the
      // caller's argument expression, which name-flow can't cross
      frontier.push({ n: nd.n, at: nd.at,
                      why: "argument — came from the caller's call " +
                        "site" });
      continue;
    }
    let dfEv = nd.at;   // "<return>": the return line IS the expr line
    if (nd.n !== "<return>") {
      // a change is reported one executed line late — walk back to
      // the assignment's own line in this frame
      let pj = nd.at - 1;
      while (pj >= 0 && eventFrame[pj] !== nd.fid) pj--;
      if (pj < 0) {
        frontier.push({ n: nd.n, at: nd.at,
                        why: "born before this frame's recorded " +
                          "events" });
        continue;
      }
      dfEv = pj;
    }
    const srcs = (((DATA.dataflow || {})[events[dfEv].f] || {})
                  [events[dfEv].l] || {})[nd.n];
    if (!srcs) {
      frontier.push({ n: nd.n, at: nd.at,
                      why: "assignment not name-tracked (attribute/" +
                        "subscript target, in-place mutation, or a " +
                        "C-level effect)" });
      continue;
    }
    for (const s of srcs) {
      const last = lastChangeBefore(s, nd.fid, nd.at, false);
      if (last >= 0) queue.push({ n: s, at: last, fid: nd.fid });
      else frontier.push({ n: s, at: -1,
                           why: "parameter, literal input, or set " +
                             "before this frame" });
    }
    // calls on the assignment line: the value may have come THROUGH
    // a return — every DIRECT-child return between the line and the
    // change joins the chain and continues inside its callee
    if (nd.n !== "<return>") {
      for (let j = nd.at - 1; j > dfEv; j--) {
        if (events[j].e !== "return") continue;
        const cfid = eventFrame[j];
        if (cfid === nd.fid) continue;
        let c0 = -1;
        for (let k = j; k > dfEv; k--)
          if (eventFrame[k] === cfid && events[k].e === "call") c0 = k;
        if (c0 > 0 && eventFrame[c0 - 1] === nd.fid)
          queue.push({ n: "<return>", at: j, fid: cfid });
      }
    }
  }
  return { label, seed: at, evs, frontier, truncated,
           order: [...evs].sort((a, b) => a - b) };
}

function ensureSmarks() {
  let box = document.getElementById("smarks");
  if (!box) {
    box = document.createElement("div");
    box.id = "smarks";
    const bar = document.getElementById("qbar");
    bar.parentNode.insertBefore(box, bar);
  }
  return box;
}

function drawSlice() {
  const box = ensureSmarks(), bar = $("slicebar");
  box.innerHTML = "";
  box.style.display = "none";
  if (!SLICE) { bar.style.display = "none"; return; }
  const total = Math.max(1, events.length - 1);
  SLICE.order.forEach(j => {
    const p = document.createElement("span");
    p.className = "smark";
    p.style.left = (j / total * 100) + "%";
    p.title = "slice — event " + (j + 1);
    p.onclick = () => { stop(); goto(j); };
    box.appendChild(p);
  });
  box.style.display = "";
  const fr = SLICE.frontier;
  bar.innerHTML = "✂ SLICE of <b>" + escapeHtml(SLICE.label) +
    "</b> @ ev " + (SLICE.seed + 1) + " — " + SLICE.order.length +
    " event(s)" +
    (fr.length ? ' · <span class="sfront" title="' +
      escapeHtml(fr.slice(0, 12).map(f => f.n + ": " + f.why)
        .join("\n") +
        (fr.length > 12 ? "\n+" + (fr.length - 12) + " more" : "")) +
      '">' + fr.length +
      " frontier stop(s) — the chain is not tracked past these" +
      "</span>" : "") +
    (SLICE.truncated ? " · capped at " + SLICE_CAP + " events" : "") +
    " · ←/→ walk the slice" +
    '<button id="sliceoff">exit (Esc)</button>';
  bar.style.display = "block";
  $("sliceoff").onclick = exitSlice;
}

function enterSlice(label) {
  SLICE = computeSlice(label, idx);
  drawSlice();
}
function exitSlice() {
  SLICE = null;
  drawSlice();
}
function sliceStep(dir) {
  if (!SLICE || !SLICE.order.length) { goto(idx + dir); return; }
  const o = SLICE.order;
  if (dir > 0) {
    for (const j of o) if (j > idx) { goto(j); return; }
  } else {
    for (let k = o.length - 1; k >= 0; k--)
      if (o[k] < idx) { goto(o[k]); return; }
  }
}

function runQuery() {
  const q = $("query").value;
  const box = ensureQmarks();
  box.innerHTML = "";
  box.style.display = "none";
  qHits = [];
  if (!q.trim()) { $("qcount").textContent = ""; return; }
  const { preds, bad } = parseQuery(q);
  if (bad.length) {
    $("qcount").textContent = "unrecognized: " + bad.join(" ");
    return;
  }
  for (let i = 0; i < events.length; i++) {
    const e = events[i];
    let ok = true;
    for (const p of preds) if (!p(e, i)) { ok = false; break; }
    if (ok) qHits.push(i);
  }
  let label = qHits.length + " hit" + (qHits.length === 1 ? "" : "s");
  if (qHits.length && qHits.length <= 3000) {
    const total = Math.max(1, events.length - 1);
    qHits.forEach(j => {
      const p = document.createElement("span");
      p.className = "qmark";
      p.style.left = (j / total * 100) + "%";
      p.title = "hit — event " + (j + 1);
      p.onclick = () => { stop(); goto(j); };
      box.appendChild(p);
    });
    box.style.display = "";
  } else if (qHits.length) {
    label += " — pins skipped past 3000";
  }
  $("qcount").textContent = label;
}
function jumpHit(dir) {
  if (!qHits.length) return;
  stop();
  if (dir > 0) {
    const t = qHits.find(j => j > idx);
    goto(t !== undefined ? t : qHits[0]);          // wrap around
  } else {
    const arr = qHits.filter(j => j < idx);
    goto(arr.length ? arr[arr.length - 1] : qHits[qHits.length - 1]);
  }
}
let qTimer = null;
$("query").addEventListener("input", () => {
  if (qTimer) clearTimeout(qTimer);
  qTimer = setTimeout(runQuery, 200);
});
$("query").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    if (qTimer) { clearTimeout(qTimer); qTimer = null; }
    runQuery();
    jumpHit(e.shiftKey ? -1 : 1);
  }
});
ctl("q-prev", () => jumpHit(-1));
ctl("q-next", () => jumpHit(1));

/* deep links: the URL fragment IS the viewer state.
   #ev=8412&var=dist&view=graph&ov=seen — paste the address into an
   issue and the reader lands on that event, with that variable's life
   strip open in that view. Written on every render (debounced,
   replaceState: the address bar follows without polluting history —
   and without firing hashchange, so there is no echo loop); read at
   load and on hashchange (edit the hash of an open trace by hand).
   An unknown var or view degrades exactly like any stale pref:
   cells view, no dead panel. */
let hashTimer = null;
function updateHash() {
  if (hashTimer) clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    let h = "#ev=" + (idx + 1);
    if (historyVar) {
      h += "&var=" + encodeURIComponent(historyVar);
      const view = getViewPref(lastFnq + historyVar);
      if (view !== "cells") {
        h += "&view=" + encodeURIComponent(view);
        if (view === "graph" || view === "edges") {
          const ov = getPref(lastFnq + historyVar + ":overlay", "");
          if (ov) h += "&ov=" + encodeURIComponent(ov);
        }
      }
    }
    if (location.hash !== h) {
      try { history.replaceState(null, "", h); }
      catch (e) { location.hash = h; }   // exotic embeddings: hash echo is harmless
    }
  }, 150);
}
function applyHash() {
  const raw = location.hash.replace(/^#/, "");
  if (!raw) return;
  const p = {};
  raw.split("&").forEach(part => {
    const eq = part.indexOf("=");
    if (eq <= 0) return;
    try { p[part.slice(0, eq)] = decodeURIComponent(part.slice(eq + 1)); }
    catch (err) {}   // one malformed escape must not kill the rest
  });
  const n = parseInt(p.ev, 10);
  if (!Number.isNaN(n)) idx = Math.max(0, Math.min(events.length - 1, n - 1));
  if (p.var !== undefined) historyVar = p.var || null;
  if (p.var && p.view) {
    // the pref key is frame-qualified: derive it from the TARGET event
    const { stack } = computeStacks(idx);
    const top = stack[stack.length - 1] || {};
    const fnq = (top.fn || "?") + "/";
    setViewPref(fnq + p.var, p.view);
    if (p.ov && (p.view === "graph" || p.view === "edges"))
      setViewPref(fnq + p.var + ":overlay", p.ov);
  }
}
window.addEventListener("hashchange", () => { stop(); applyHash(); render(); });

if (events.length) { applyHash(); render(); }
else $("code").innerHTML = '<div class="empty" style="padding:20px">No events recorded.</div>';

/* tiny console handle — everything now lives inside the async boot
   scope, so expose the essentials for debugging and verification */
window.PYREPLAY = {
  goto, stop,
  info: () => ({ events: events.length,
                 chunked: !!DATA.chunked,
                 keyframes: kfIndices.length })
};
})();
</script>
